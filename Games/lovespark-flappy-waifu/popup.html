<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Waifu</title>
<link rel="stylesheet" href="lib/lovespark-fonts.css">
<link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot">
      <div>
        <h1>Flappy Waifu</h1>
        <p class="tagline" id="mastery-tag"></p>
      </div>
      <div class="hearts-badge" id="hearts-badge">0 <span class="heart-icon">&hearts;</span></div>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
    </header>

    <div id="waifu-mood" class="waifu-mood-card">
      <span id="mood-text"></span>
    </div>

    <button class="play-btn" id="play-btn">Play Now</button>

    <div id="daily-card" class="daily-card">
      <div class="daily-header">
        <span class="daily-title">Daily Challenge</span>
        <span class="daily-reward" id="daily-reward"></span>
      </div>
      <div class="daily-desc" id="daily-desc"></div>
      <div class="daily-bar-wrap">
        <div class="daily-bar">
          <div class="daily-fill" id="daily-fill"></div>
        </div>
        <span class="daily-pct" id="daily-pct"></span>
      </div>
    </div>

    <div class="streak-card" id="streak-card">
      <div class="streak-header">
        <span class="streak-label">Streak</span>
        <span class="streak-count" id="streak-count">0</span>
      </div>
      <div class="streak-stamps" id="streak-stamps"></div>
    </div>

    <div class="stats-card">
      <div class="stats-row">
        <span class="stats-label">Best Score</span>
        <span class="stats-value" id="stat-best">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Games Played</span>
        <span class="stats-value" id="stat-games">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Best Combo</span>
        <span class="stats-value" id="stat-combo">0</span>
      </div>
    </div>

    <footer class="popup-footer">
      <a href="#" id="settings-link">Stats & Settings</a>
      <span class="suite-tag">LoveSpark Suite</span>
    </footer>
  </div>
  <script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
