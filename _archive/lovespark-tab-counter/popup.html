<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Tab Counter</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky -- LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Tab Counter</div>
        <div class="header-sub" id="popupDesc">LoveSpark Suite</div>
      </div>
      <div class="theme-dropdown">
        <button class="theme-dropdown-trigger" id="themeToggle" aria-haspopup="true" aria-expanded="false" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span> &#9662;
        </button>
        <div class="theme-dropdown-menu" id="themeMenu" role="menu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option" data-theme="retro" role="menuitem">Retro Pink</button>
          <button class="theme-option" data-theme="dark" role="menuitem">Dark</button>
          <button class="theme-option" data-theme="beige" role="menuitem">Beige</button>
          <button class="theme-option" data-theme="slate" role="menuitem">Slate</button>
        </div>
      </div>
    </header>

    <main class="popup-content">
      <div class="big-count-section">
        <div id="bigCount" class="big-count" aria-live="polite">0</div>
        <div class="big-count-label">open tabs</div>
        <div id="warnMsg" class="warn-msg hidden" role="alert" aria-live="assertive"></div>
      </div>

      <label class="toggle-wrap">
        <input type="checkbox" id="enableToggle" checked aria-label="Enable tab counter">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>

      <div class="threshold-section">
        <label for="thresholdInput" class="threshold-label">Warning threshold</label>
        <input type="number" id="thresholdInput" class="threshold-input" min="1" max="999" value="20" aria-label="Tab warning threshold">
      </div>

      <div class="windows-header">Windows</div>
      <div id="windowList" class="window-list" role="list" aria-label="Tabs per window"></div>
    </main>

    <footer class="ls-footer">
      <span class="ls-footer-suite">LoveSpark Suite</span>
      <span class="ls-footer-credit">LoveSpark by Joona Tyrninoksa</span>
    </footer>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
