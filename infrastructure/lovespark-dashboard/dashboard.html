<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveSpark Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Base ── */
body {
  background: #0D0D0D;
  color: #E0E0E0;
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
}

/* ── Scanline overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  border-bottom: 1px solid rgba(255, 107, 157, 0.15);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mascot {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #FF6B9D;
  text-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
}

.header-right {
  display: flex;
  gap: 10px;
}

.stat-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}

.active-pill {
  background: rgba(255, 107, 157, 0.15);
  color: #FF6B9D;
  border: 1px solid rgba(255, 107, 157, 0.3);
}

.total-pill {
  background: rgba(255, 255, 255, 0.05);
  color: #888;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* ── Controls bar ── */
.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px 32px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.search-wrap { flex: 0 0 280px; }

#search {
  width: 100%;
  padding: 10px 16px;
  background: #1A1A2E;
  border: 1px solid #333;
  border-radius: 8px;
  color: #E0E0E0;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#search:focus {
  border-color: #FF6B9D;
  box-shadow: 0 0 12px rgba(255, 107, 157, 0.2);
}

#search::placeholder { color: #555; }

.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  flex: 1;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  padding: 8px 16px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: #666;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}

.cat-tab:hover { color: #999; }

.cat-tab.active {
  color: #FF6B9D;
  border-bottom-color: #FF6B9D;
  text-shadow: 0 0 8px rgba(255, 107, 157, 0.3);
}

/* ── Extension grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  padding: 24px 32px;
}

/* ── Cards ── */
.ext-card {
  background: #1A1A2E;
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 20px;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.ext-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 107, 157, 0.2);
  box-shadow: 0 8px 24px rgba(255, 107, 157, 0.08);
}

.ls-card {
  border-color: rgba(255, 107, 157, 0.2);
  box-shadow: 0 0 16px rgba(255, 107, 157, 0.08);
}

.ls-card:hover {
  border-color: rgba(255, 107, 157, 0.4);
  box-shadow: 0 0 24px rgba(255, 107, 157, 0.15);
}

.disabled-card { opacity: 0.5; }

.card-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.card-icon {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-icon img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.fallback-icon {
  background: linear-gradient(135deg, #FF6B9D, #FF2D78);
}

.fallback-icon::after { content: '\1F496'; font-size: 22px; }

.card-info {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: #FFF;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ls-sparkle { font-size: 12px; }

.card-version {
  font-size: 11px;
  color: #FF6B9D;
  opacity: 0.7;
  margin-top: 2px;
}

.card-desc {
  font-size: 12px;
  color: #888;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
}

/* ── Category badges ── */
.cat-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 500;
}

.badge-lovespark  { background: rgba(255, 107, 157, 0.15); color: #FF6B9D; }
.badge-adblock    { background: rgba(255, 71, 87, 0.15);   color: #FF4757; }
.badge-privacy    { background: rgba(46, 213, 115, 0.15);  color: #2ED573; }
.badge-productivity { background: rgba(129, 140, 248, 0.15); color: #818CF8; }
.badge-devtools   { background: rgba(255, 165, 2, 0.15);   color: #FFA502; }
.badge-media      { background: rgba(165, 94, 234, 0.15);  color: #A55EEA; }
.badge-shopping   { background: rgba(255, 211, 42, 0.15);  color: #FFD32A; }
.badge-other      { background: rgba(116, 125, 140, 0.15); color: #747D8C; }

/* ── Toggle switch ── */
.toggle-wrap {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  flex-shrink: 0;
}

.toggle-wrap input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.toggle-track {
  width: 44px;
  height: 22px;
  background: #333;
  border-radius: 11px;
  position: relative;
  transition: background 0.2s;
}

.toggle-wrap input:checked + .toggle-track {
  background: #FF6B9D;
  box-shadow: 0 0 10px rgba(255, 107, 157, 0.3);
}

.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  background: #FFF;
  border-radius: 50%;
  transition: transform 0.2s;
}

.toggle-wrap input:checked + .toggle-track .toggle-knob {
  transform: translateX(22px);
}

.toggle-wrap.disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.self-badge {
  font-size: 11px;
  color: #FF6B9D;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── Toasts ── */
.toasts {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10000;
}

.toast {
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  color: #FFF;
  transform: translateX(120%);
  transition: transform 0.3s ease, opacity 0.3s ease;
  max-width: 320px;
}

.toast.show { transform: translateX(0); }
.toast.hide { opacity: 0; transform: translateX(50%); }

.toast-success {
  background: linear-gradient(135deg, #FF6B9D, #FF2D78);
  box-shadow: 0 4px 20px rgba(255, 107, 157, 0.25);
}

.toast-error {
  background: linear-gradient(135deg, #8B0000, #CC0000);
  box-shadow: 0 4px 20px rgba(139, 0, 0, 0.25);
}

/* ── Empty state ── */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: #666;
  font-size: 16px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0D0D0D; }
::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 107, 157, 0.4); }

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="36" height="36">
    <h1>✨ LoveSpark Dashboard ✨</h1>
  </div>
  <div class="header-right">
    <span class="stat-pill active-pill"><span id="active-count">0</span> Active</span>
    <span class="stat-pill total-pill"><span id="total-count">0</span> Total</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search extensions..." autocomplete="off">
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>

<main class="grid" id="grid"></main>

<div class="toasts" id="toasts"></div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────

const SELF_ID = chrome.runtime.id;

const LOVESPARK_KNOWN_NAMES = new Set([
  'porn blocker rewire brain',
  "i don't want cookies",
  'anti brainrot',
  'are you cooked',
]);

const CATEGORIES = [
  { id: 'lovespark',    label: '✨ LoveSpark Suite',  match: ext => isLoveSpark(ext) },
  { id: 'adblock',      label: 'Ad Blockers',         keywords: ['adblock', 'ad block', 'ublock', 'ads', 'blocker', 'adguard'] },
  { id: 'privacy',      label: 'Privacy & Security',  keywords: ['privacy', 'vpn', 'cookie', 'tracker', 'https', 'password', 'security', 'encrypt', 'referrer', 'fingerprint', 'metadata'] },
  { id: 'productivity', label: 'Productivity',         keywords: ['todo', 'tab', 'bookmark', 'focus', 'timer', 'pomodoro', 'notes', 'clipboard', 'manager'] },
  { id: 'devtools',     label: 'Dev Tools',            keywords: ['devtool', 'react', 'vue', 'redux', 'json', 'debug', 'inspect', 'lighthouse', 'wappalyzer', 'console'] },
  { id: 'media',        label: 'Media & Content',      keywords: ['video', 'youtube', 'image', 'screenshot', 'download', 'music', 'spotify', 'reader', 'dark mode'] },
  { id: 'shopping',     label: 'Shopping',             keywords: ['coupon', 'price', 'deal', 'cashback', 'honey', 'shop', 'amazon'] },
  { id: 'other',        label: 'Other',                match: () => true },
];

// ── State ─────────────────────────────────────────────────────────────────────

let allExtensions = [];
let activeCategory = 'all';
let searchQuery = '';

// ── DOM refs ──────────────────────────────────────────────────────────────────

const activeCountEl = document.getElementById('active-count');
const totalCountEl  = document.getElementById('total-count');
const searchInput   = document.getElementById('search');
const tabsEl        = document.getElementById('tabs');
const gridEl        = document.getElementById('grid');
const toastsEl      = document.getElementById('toasts');

// ── Utilities ─────────────────────────────────────────────────────────────────

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function isLoveSpark(ext) {
  const name = ext.name.toLowerCase();
  const homepage = (ext.homepageUrl || '').toLowerCase();
  return name.startsWith('lovespark') ||
         name.startsWith('love spark') ||
         LOVESPARK_KNOWN_NAMES.has(name) ||
         homepage.includes('lovespark');
}

function categorize(ext) {
  const haystack = (ext.name + ' ' + (ext.description || '')).toLowerCase();
  for (const cat of CATEGORIES) {
    if (cat.match && cat.match(ext)) return cat.id;
    if (cat.keywords && cat.keywords.some(kw => haystack.includes(kw))) return cat.id;
  }
  return 'other';
}

function getExtIcon(ext) {
  if (!ext.icons || !ext.icons.length) return null;
  // Prefer size closest to 48, then largest
  const sorted = [...ext.icons].sort((a, b) => {
    const ad = Math.abs(a.size - 48);
    const bd = Math.abs(b.size - 48);
    return ad !== bd ? ad - bd : b.size - a.size;
  });
  return sorted[0].url;
}

// ── Data ──────────────────────────────────────────────────────────────────────

async function loadExtensions() {
  const all = await chrome.management.getAll();
  allExtensions = all.filter(ext => ext.type === 'extension');
  render();
}

// ── Rendering ─────────────────────────────────────────────────────────────────

function render() {
  updateStats();
  updateCategoryTabs();
  renderGrid();
}

function updateStats() {
  const nonSelf = allExtensions.filter(e => e.id !== SELF_ID);
  activeCountEl.textContent = nonSelf.filter(e => e.enabled).length;
  totalCountEl.textContent = nonSelf.length;
}

function updateCategoryTabs() {
  const counts = {};
  for (const ext of allExtensions) {
    const cat = categorize(ext);
    counts[cat] = (counts[cat] || 0) + 1;
  }

  let html = '<button class="cat-tab' + (activeCategory === 'all' ? ' active' : '') + '" data-cat="all">All</button>';
  for (const cat of CATEGORIES) {
    if (!counts[cat.id]) continue;
    html += '<button class="cat-tab' + (activeCategory === cat.id ? ' active' : '') + '" data-cat="' + cat.id + '">' + cat.label + '</button>';
  }
  tabsEl.innerHTML = html;
}

function renderGrid() {
  let filtered = allExtensions;

  // Category filter
  if (activeCategory !== 'all') {
    filtered = filtered.filter(ext => categorize(ext) === activeCategory);
  }

  // Search filter
  if (searchQuery) {
    filtered = filtered.filter(ext => {
      const hay = (ext.name + ' ' + (ext.description || '')).toLowerCase();
      return hay.includes(searchQuery);
    });
  }

  // Sort: LoveSpark first, enabled before disabled, then alphabetical
  filtered.sort((a, b) => {
    const aLS = isLoveSpark(a) ? 0 : 1;
    const bLS = isLoveSpark(b) ? 0 : 1;
    if (aLS !== bLS) return aLS - bLS;
    if (a.enabled !== b.enabled) return a.enabled ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  // Empty state
  if (!filtered.length) {
    gridEl.innerHTML = '<div class="empty-state">' +
      (searchQuery ? 'No extensions match your search ✨' : 'Just you and me ✨ — install some extensions!') +
      '</div>';
    return;
  }

  gridEl.innerHTML = filtered.map(createCard).join('');

  // Toggle listeners
  gridEl.querySelectorAll('.toggle-input:not([disabled])').forEach(input => {
    input.addEventListener('change', e => {
      toggleExtension(e.target.dataset.extId, e.target.checked, e.target.dataset.extName);
    });
  });

  // Icon error fallbacks
  gridEl.querySelectorAll('.card-icon img').forEach(img => {
    img.addEventListener('error', () => {
      img.style.display = 'none';
      img.parentElement.classList.add('fallback-icon');
    });
  });
}

function createCard(ext) {
  const cat = categorize(ext);
  const catObj = CATEGORIES.find(c => c.id === cat);
  const isLS = isLoveSpark(ext);
  const isSelf = ext.id === SELF_ID;
  const iconUrl = getExtIcon(ext);

  const iconHtml = iconUrl
    ? '<img src="' + iconUrl + '" alt="" width="48" height="48">'
    : '';

  let toggleHtml;
  if (isSelf) {
    toggleHtml = '<span class="self-badge">That\'s me! ✨</span>';
  } else if (!ext.mayDisable) {
    toggleHtml = '<label class="toggle-wrap disabled" title="Managed by your organization">' +
      '<input type="checkbox" class="toggle-input" checked disabled>' +
      '<span class="toggle-track"><span class="toggle-knob"></span></span></label>';
  } else {
    toggleHtml = '<label class="toggle-wrap">' +
      '<input type="checkbox" class="toggle-input" data-ext-id="' + ext.id + '" data-ext-name="' + escapeHtml(ext.name) + '"' + (ext.enabled ? ' checked' : '') + '>' +
      '<span class="toggle-track"><span class="toggle-knob"></span></span></label>';
  }

  return '<div class="ext-card' + (isLS ? ' ls-card' : '') + (!ext.enabled ? ' disabled-card' : '') + '">' +
    '<div class="card-top">' +
      '<div class="card-icon' + (!iconUrl ? ' fallback-icon' : '') + '">' + iconHtml + '</div>' +
      '<div class="card-info">' +
        '<div class="card-name">' + (isLS ? '<span class="ls-sparkle">✨</span> ' : '') + escapeHtml(ext.name) + '</div>' +
        '<div class="card-version">v' + escapeHtml(ext.version) + '</div>' +
      '</div>' +
      toggleHtml +
    '</div>' +
    '<div class="card-desc">' + escapeHtml(ext.description || 'No description') + '</div>' +
    '<span class="cat-badge badge-' + cat + '">' + catObj.label + '</span>' +
  '</div>';
}

// ── Actions ───────────────────────────────────────────────────────────────────

async function toggleExtension(extId, newState, extName) {
  try {
    await chrome.management.setEnabled(extId, newState);
    showToast(extName + (newState ? ' enabled ✨' : ' disabled'), 'success');
  } catch (err) {
    showToast('Failed: ' + err.message, 'error');
    // Revert checkbox on failure
    const cb = gridEl.querySelector('.toggle-input[data-ext-id="' + extId + '"]');
    if (cb) cb.checked = !newState;
  }
}

function showToast(message, type) {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = message;
  toastsEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.add('hide');
    el.addEventListener('transitionend', () => el.remove());
  }, 2500);
}

// ── Events ────────────────────────────────────────────────────────────────────

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  activeCategory = tab.dataset.cat;
  render();
});

chrome.management.onInstalled.addListener(loadExtensions);
chrome.management.onUninstalled.addListener(loadExtensions);
chrome.management.onEnabled.addListener(loadExtensions);
chrome.management.onDisabled.addListener(loadExtensions);

// ── Init ──────────────────────────────────────────────────────────────────────

loadExtensions();

</script>
</body>
</html>
