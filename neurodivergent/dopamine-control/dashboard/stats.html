<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dopamine Control — Stats</title>
  <link rel="stylesheet" href="../shared/theme.css">

<link rel="stylesheet" href="stats-initial.css">
</head>
<body>

<header>
  <div class="header-dopa" id="header-dopa">😊</div>
  <div class="header-text">
    <div class="title">STATS</div>
    <div class="sub">DOPAMINE CONTROL</div>
  </div>
</header>

<div class="container">

  <!-- TODAY -->
  <div class="card">
    <div class="card-title">TODAY'S OVERVIEW</div>
    <div class="today-wrap">
      <div class="ring-wrap">
        <svg class="ring-svg" width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-track" cx="70" cy="70" r="56"/>
          <circle class="ring-fill" id="ring-fill" cx="70" cy="70" r="56"
            stroke-dasharray="351.86"
            stroke-dashoffset="351.86"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct" id="ring-pct">0%</div>
          <div class="ring-label">used</div>
        </div>
      </div>

      <div class="today-stats">
        <div class="today-stat">
          <div class="ts-label">Time Watched</div>
          <div class="ts-val" id="stat-used">0m</div>
          <div class="ts-sub">of <span id="stat-limit">2h</span> limit</div>
        </div>
        <div class="today-stat">
          <div class="ts-label">Remaining</div>
          <div class="ts-val" id="stat-remaining">2h</div>
        </div>
        <div class="today-stat" id="whitelist-stat" data-initial-style="initial-style-0">
          <div class="ts-label">📚 Whitelisted</div>
          <div class="ts-val" id="stat-whitelist">0m</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STREAK + LEVEL -->
  <div class="streak-level-row">
    <div class="sl-card">
      <div class="sl-icon">🔥</div>
      <div class="sl-val" id="streak-val">0</div>
      <div class="sl-label">Day Streak</div>
      <div class="sl-sub">Best: <span id="best-streak">0</span> days</div>
    </div>
    <div class="sl-card">
      <div class="sl-icon">⭐</div>
      <div class="sl-val" id="level-val">1</div>
      <div class="sl-label">Level</div>
      <div class="sl-sub"><span id="xp-cur">0</span> / <span id="xp-next">300</span> XP</div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" id="xp-bar" data-initial-style="initial-style-1"></div>
      </div>
    </div>
  </div>

  <!-- WEEKLY CHART -->
  <div class="card">
    <div class="card-title">THIS WEEK</div>
    <div class="week-chart" id="week-chart">
      <div class="empty-state">No data yet — keep watching (within your limit 😄)</div>
    </div>
    <div class="chart-legend">
      <span><span class="legend-dot" data-initial-style="initial-style-2"></span>Under limit</span>
      <span><span class="legend-dot" data-initial-style="initial-style-3"></span>Over limit</span>
    </div>
  </div>

</div>

<script src="../shared/utils.js"></script>
<script src="../shared/constants.js"></script>
<script src="stats.js"></script>
</body>
</html>
