<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dopamine Control — Stats</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #FFE4E1 0%, #FFF9FA 60%, #FFB6C1 100%);
      font-family: var(--font-body);
      color: var(--text-primary);
      padding: 0;
      margin: 0;
    }

    header {
      background: linear-gradient(135deg, #FF69B4, #E8408F);
      padding: 20px 32px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-dopa { font-size: 36px; }

    .header-text .title {
      font-family: var(--font-display);
      font-size: 18px;
      color: white;
    }
    .header-text .sub {
      font-family: var(--font-display);
      font-size: 10px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--surface-white);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255,182,193,0.3);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255,182,193,0.3);
      padding-bottom: 10px;
    }

    /* Today ring */
    .today-wrap {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .ring-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }

    .ring-svg {
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: var(--xp-track);
      stroke-width: 12;
    }

    .ring-fill {
      fill: none;
      stroke: var(--safe);
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease-out, stroke 0.4s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-pct {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ring-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .today-stats {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .today-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ts-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .ts-val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ts-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Streak + Level row */
    .streak-level-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .sl-card {
      background: linear-gradient(135deg, rgba(255,228,225,0.6), rgba(255,249,250,0.8));
      border: 1px solid rgba(255,182,193,0.3);
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
    }

    .sl-icon { font-size: 32px; margin-bottom: 8px; }

    .sl-val {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--pink-hot);
    }

    .sl-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-top: 4px;
    }

    .sl-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .xp-bar-track {
      height: 8px;
      background: var(--xp-track);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: var(--xp-fill);
      border-radius: 999px;
      transition: width 0.6s ease-out;
    }

    /* Weekly bar chart */
    .week-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 120px;
      padding-bottom: 4px;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .day-bar-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
    }

    .day-bar {
      width: 100%;
      border-radius: 6px 6px 0 0;
      min-height: 3px;
      transition: height 0.6s ease-out;
    }

    .day-bar.under { background: var(--safe); }
    .day-bar.over  { background: var(--danger); }
    .day-bar.today { outline: 2px solid var(--pink-hot); outline-offset: 2px; }
    .day-bar.empty { background: var(--xp-track); }

    .day-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .day-name.today { color: var(--pink-hot); }

    .chart-legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-dopa" id="header-dopa">😊</div>
  <div class="header-text">
    <div class="title">STATS</div>
    <div class="sub">DOPAMINE CONTROL</div>
  </div>
</header>

<div class="container">

  <!-- TODAY -->
  <div class="card">
    <div class="card-title">TODAY'S OVERVIEW</div>
    <div class="today-wrap">
      <div class="ring-wrap">
        <svg class="ring-svg" width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-track" cx="70" cy="70" r="56"/>
          <circle class="ring-fill" id="ring-fill" cx="70" cy="70" r="56"
            stroke-dasharray="351.86"
            stroke-dashoffset="351.86"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct" id="ring-pct">0%</div>
          <div class="ring-label">used</div>
        </div>
      </div>

      <div class="today-stats">
        <div class="today-stat">
          <div class="ts-label">Time Watched</div>
          <div class="ts-val" id="stat-used">0m</div>
          <div class="ts-sub">of <span id="stat-limit">2h</span> limit</div>
        </div>
        <div class="today-stat">
          <div class="ts-label">Remaining</div>
          <div class="ts-val" id="stat-remaining">2h</div>
        </div>
        <div class="today-stat" id="whitelist-stat" style="display:none">
          <div class="ts-label">📚 Whitelisted</div>
          <div class="ts-val" id="stat-whitelist">0m</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STREAK + LEVEL -->
  <div class="streak-level-row">
    <div class="sl-card">
      <div class="sl-icon">🔥</div>
      <div class="sl-val" id="streak-val">0</div>
      <div class="sl-label">Day Streak</div>
      <div class="sl-sub">Best: <span id="best-streak">0</span> days</div>
    </div>
    <div class="sl-card">
      <div class="sl-icon">⭐</div>
      <div class="sl-val" id="level-val">1</div>
      <div class="sl-label">Level</div>
      <div class="sl-sub"><span id="xp-cur">0</span> / <span id="xp-next">300</span> XP</div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" id="xp-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- WEEKLY CHART -->
  <div class="card">
    <div class="card-title">THIS WEEK</div>
    <div class="week-chart" id="week-chart">
      <div class="empty-state">No data yet — keep watching (within your limit 😄)</div>
    </div>
    <div class="chart-legend">
      <span><span class="legend-dot" style="background:var(--safe)"></span>Under limit</span>
      <span><span class="legend-dot" style="background:var(--danger)"></span>Over limit</span>
    </div>
  </div>

</div>

<script src="../shared/utils.js"></script>
<script src="../shared/constants.js"></script>
<script>
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const CIRCUMFERENCE = 2 * Math.PI * 56; // r=56

  function xpForNextLevel(level) {
    return level * 100 + 200;
  }

  function render(data) {
    const limit = data.isWeekend ? data.weekendLimit : data.weekdayLimit;
    const used = data.watchTime || 0;
    const remaining = Math.max(0, limit - used);
    const pct = Math.min(100, (used / limit) * 100);

    // Header dopa
    const dopa = document.getElementById('header-dopa');
    if (pct >= 100) dopa.textContent = '😴';
    else if (pct >= 85) dopa.textContent = '😰';
    else if (pct >= 70) dopa.textContent = '😟';
    else if (pct >= 50) dopa.textContent = '😐';
    else dopa.textContent = '😊';

    // Ring
    const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
    const ringFill = document.getElementById('ring-fill');
    ringFill.style.strokeDashoffset = offset;
    if (pct >= 95) ringFill.style.stroke = 'var(--danger-deep)';
    else if (pct >= 80) ringFill.style.stroke = 'var(--danger)';
    else if (pct >= 60) ringFill.style.stroke = 'var(--caution)';
    else ringFill.style.stroke = 'var(--safe)';

    document.getElementById('ring-pct').textContent = Math.round(pct) + '%';

    // Stats
    document.getElementById('stat-used').textContent = formatTime(used);
    document.getElementById('stat-limit').textContent = formatTime(limit);
    document.getElementById('stat-remaining').textContent = formatTime(remaining);

    if (data.whitelistTime > 0) {
      document.getElementById('whitelist-stat').style.display = 'block';
      document.getElementById('stat-whitelist').textContent = formatTime(data.whitelistTime);
    }

    // Streak + level
    document.getElementById('streak-val').textContent = data.streak || 0;
    document.getElementById('best-streak').textContent = data.bestStreak || 0;
    document.getElementById('level-val').textContent = data.level || 1;

    const xpNeeded = xpForNextLevel(data.level || 1);
    const xp = data.xp || 0;
    document.getElementById('xp-cur').textContent = xp;
    document.getElementById('xp-next').textContent = xpNeeded;
    document.getElementById('xp-bar').style.width = Math.min(100, (xp / xpNeeded) * 100) + '%';

    // Weekly chart
    renderWeekChart(data.dailyHistory || [], limit, used);
  }

  function renderWeekChart(history, todayLimit, todayUsed) {
    const chart = document.getElementById('week-chart');
    const today = new Date();
    const todayStr = getTodayString();

    // Build the last 7 days
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const isToday = dateStr === todayStr;
      const hist = history.find(h => h.date === dateStr);
      days.push({
        name: DAYS[d.getDay()],
        isToday,
        watchTime: isToday ? todayUsed : (hist ? hist.watchTime : null),
        limit: hist ? hist.limit : todayLimit,
        underLimit: isToday ? (todayUsed <= todayLimit) : (hist ? hist.underLimit : true),
        hasData: isToday || !!hist
      });
    }

    // Find max for scaling
    const maxTime = Math.max(...days.map(d => d.watchTime || 0), 1);

    chart.innerHTML = '';
    days.forEach(day => {
      const col = document.createElement('div');
      col.className = 'day-col';

      const barWrap = document.createElement('div');
      barWrap.className = 'day-bar-wrap';

      const bar = document.createElement('div');
      bar.className = 'day-bar';

      if (!day.hasData) {
        bar.classList.add('empty');
        bar.style.height = '4px';
      } else {
        bar.classList.add(day.underLimit ? 'under' : 'over');
        const heightPct = day.watchTime ? Math.max(8, (day.watchTime / maxTime) * 100) : 4;
        bar.style.height = heightPct + '%';
        if (day.isToday) bar.classList.add('today');

        bar.title = `${day.name}: ${formatTime(day.watchTime || 0)} / ${formatTime(day.limit)}`;
      }

      const name = document.createElement('div');
      name.className = 'day-name' + (day.isToday ? ' today' : '');
      name.textContent = day.name;

      barWrap.appendChild(bar);
      col.appendChild(barWrap);
      col.appendChild(name);
      chart.appendChild(col);
    });
  }

  // Load data
  chrome.runtime.sendMessage({ type: 'GET_FULL_STATUS' }, (data) => {
    if (chrome.runtime.lastError || !data) {
      document.querySelector('.container').innerHTML =
        '<div class="card"><p style="text-align:center;color:var(--text-secondary)">Could not load stats. Open the extension popup first.</p></div>';
      return;
    }
    render(data);
  });

  // Refresh every 10s
  setInterval(() => {
    chrome.runtime.sendMessage({ type: 'GET_FULL_STATUS' }, (data) => {
      if (data) render(data);
    });
  }, 10000);
</script>
</body>
</html>
