<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Blossom</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="loading-state" id="loadingState" data-i18n="blockedLoading" aria-live="polite">Growing...</div>

  <div class="container" id="mainContainer" style="display:none" aria-live="polite">
    <div class="garden-canvas-wrap">
      <canvas id="gardenCanvas"></canvas>
    </div>

    <div class="info-panel">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="info-mascot">
      <div class="domain-row">
        <span class="stage-emoji" id="stageEmoji" aria-live="polite"></span>
        <span class="domain-name" id="domainName" aria-live="polite"></span>
        <span class="day-count" id="dayCount" aria-live="polite"></span>
      </div>

      <div class="stage-label" id="stageLabel" aria-live="polite"></div>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
        <span class="progress-text" id="progressText" aria-live="polite"></span>
      </div>

      <div class="affirmation" id="affirmation" aria-live="polite"></div>

      <button class="back-btn" id="backBtn" data-i18n="blockedBackBtn">&larr; Go Back</button>

      <div class="unblock-link" id="unblockLink" tabindex="0" role="button" data-i18n="blockedUnblockLink">I need to visit this site...</div>
    </div>

    <!-- Friction overlay -->
    <div class="friction-overlay" id="frictionOverlay" style="display:none" role="dialog" aria-labelledby="frictionTitle" aria-modal="true" aria-live="polite">
      <div class="friction-card">
        <div class="friction-title" id="frictionTitle" data-i18n="blockedFrictionTitle">Are you sure?</div>
        <div class="friction-body" id="frictionBody" data-i18n="blockedFrictionBody">
          Unblocking will wilt your garden. Your flowers will lose half their growth.
        </div>
        <div class="friction-preview">
          <canvas id="frictionCanvas" width="280" height="160"></canvas>
        </div>
        <!-- Timer text is fully rendered by blocked.js using chrome.i18n.getMessage("blockedFrictionWait", [seconds]) -->
        <div class="friction-timer" id="frictionTimer" style="display:none" aria-live="polite">
          Wait <span id="timerCount">30</span>s...
        </div>
        <div class="friction-input-wrap" id="frictionInputWrap" style="display:none" aria-live="polite">
          <label class="friction-input-label" id="frictionInputLabel" for="frictionInput">Type the domain to confirm:</label>
          <input type="text" class="friction-input" id="frictionInput" autocomplete="off" spellcheck="false">
        </div>
        <div class="friction-buttons">
          <button class="btn-cancel" id="frictionCancel" data-i18n="blockedFrictionCancel">Cancel</button>
          <button class="btn-unblock" id="frictionConfirm" disabled data-i18n="blockedFrictionConfirm">I understand, unblock</button>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/i18n-html.js"></script>
  <script src="garden-sprites.js"></script>
  <script src="affirmations.js"></script>
  <script src="garden.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
