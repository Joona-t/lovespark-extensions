<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Blossom — Blocked (CWS screenshot)</title>
  <base href="../">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="blocked.css">
  <style>
    /* CWS-screenshot overrides — force content to fill 1280x800 viewport edge-to-edge */
    html, body { margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 800px;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      align-items: stretch;
      justify-content: stretch;
    }
    .container {
      width: 100% !important;
      max-width: none !important;
      height: 100%;
      padding: 36px 48px !important;
      gap: 28px !important;
    }
    .garden-canvas-wrap {
      height: 540px !important;
      width: 100%;
      max-width: none !important;
    }
    .info-panel {
      max-width: none !important;
      width: 100%;
    }
  </style>
</head>
<body>
  <script src="cws-shots/mock.js"></script>
  <div class="loading-state" id="loadingState">Growing...</div>
  <div class="container" id="mainContainer" style="display:none">
    <div class="garden-canvas-wrap"><canvas id="gardenCanvas"></canvas></div>
    <div class="info-panel">
      <div class="domain-row">
        <span class="stage-emoji" id="stageEmoji"></span>
        <span class="domain-name" id="domainName"></span>
        <span class="day-count" id="dayCount"></span>
      </div>
      <div class="stage-label" id="stageLabel"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
        <span class="progress-text" id="progressText"></span>
      </div>
      <div class="affirmation" id="affirmation"></div>
      <button class="back-btn" id="backBtn">&larr; Go Back</button>
      <div class="unblock-link" id="unblockLink" tabindex="0" role="button">I need to visit this site...</div>
    </div>
    <div class="friction-overlay" id="frictionOverlay" style="display:none" role="dialog" aria-labelledby="frictionTitle" aria-modal="true">
      <div class="friction-card">
        <div class="friction-title" id="frictionTitle">Are you sure?</div>
        <div class="friction-body" id="frictionBody">Unblocking will wilt your garden. Your flowers will lose half their growth.</div>
        <div class="friction-preview"><canvas id="frictionCanvas" width="280" height="160"></canvas></div>
        <div class="friction-timer" id="frictionTimer" style="display:none">Wait <span id="timerCount">30</span>s...</div>
        <div class="friction-input-wrap" id="frictionInputWrap" style="display:none">
          <label class="friction-input-label" id="frictionInputLabel" for="frictionInput">Type the domain to confirm:</label>
          <input type="text" class="friction-input" id="frictionInput" autocomplete="off" spellcheck="false">
        </div>
        <div class="friction-buttons">
          <button class="btn-cancel" id="frictionCancel">Cancel</button>
          <button class="btn-unblock" id="frictionConfirm" disabled>I understand, unblock</button>
        </div>
      </div>
    </div>
  </div>
  <script src="garden-sprites.js"></script>
  <script src="affirmations.js"></script>
  <script src="garden.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
