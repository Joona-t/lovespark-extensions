<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Blossom</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <!-- Shared LoveSpark tokens/base come first so popup.css overrides any drift -->
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="headerTitle">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot">
      <span class="header-title" id="headerTitle">Focus Blossom</span>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle" aria-haspopup="true" aria-expanded="false">
        <span id="themeLabel" aria-live="polite">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header" data-i18n="popupChangeTheme">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
    </header>

    <!-- Garden Grid -->
    <div class="garden-grid" id="gardenGrid" aria-live="polite"></div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none" aria-live="polite">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" style="width:64px;height:64px;margin-bottom:8px">
      <div class="empty-emoji">🌱</div>
      <div class="empty-text">
        <div data-i18n="popupEmptyTitle">No gardens yet!</div>
        <div data-i18n="popupEmptyHint">Block a site to start growing.</div>
      </div>
      <div class="preset-buttons">
        <button class="btn-preset" data-domain="reddit.com">reddit.com</button>
        <button class="btn-preset" data-domain="x.com">x.com</button>
        <button class="btn-preset" data-domain="tiktok.com">tiktok.com</button>
        <button class="btn-preset" data-domain="instagram.com">instagram.com</button>
      </div>
    </div>

    <!-- Add site -->
    <div class="add-site-row">
      <input type="text" id="siteInput" class="site-input"
             placeholder="e.g. reddit.com" data-i18n-placeholder="popupSitePlaceholder"
             spellcheck="false" autocomplete="off"
             aria-label="Site domain to block" data-i18n-aria-label="popupSiteAria">
      <button class="btn-add" id="addBtn" data-i18n="popupBtnAdd">+ Add</button>
    </div>

    <!-- Stats -->
    <div class="stats-card" id="statsCard">
      <div class="stats-row">
        <span class="stats-label" data-i18n="popupStatGardens">🌱 Gardens growing</span>
        <span class="stats-value" id="statGrowing" aria-live="polite">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label" data-i18n="popupStatStreak">🔥 Longest streak</span>
        <span class="stats-value" id="statStreak" aria-live="polite">0d</span>
      </div>
      <div class="stats-row">
        <span class="stats-label" data-i18n="popupStatBlocked">⏱️ Total blocked</span>
        <span class="stats-value" id="statBlocked" aria-live="polite">0h</span>
      </div>
      <div class="stats-row">
        <span class="stats-label" data-i18n="popupStatSpeed">⚡ Growth speed</span>
        <span class="stats-value" id="statSpeed" aria-live="polite">1.0x</span>
      </div>
    </div>

    <!-- Affirmation -->
    <div class="affirmation" id="affirmation" aria-live="polite"></div>

    <footer class="popup-footer">
      <span>LoveSpark Suite 💕</span>
      <a class="settings-link" id="settingsLink"
         title="Settings" data-i18n-title="popupSettingsTitle"
         tabindex="0" role="button"
         aria-label="Settings" data-i18n-aria-label="popupSettingsTitle">⚙</a>
    </footer>
  </div>

  <script src="lib/i18n-html.js"></script>
  <!-- Shared theme module is loaded for brand consistency; popup.js uses its own
       init routine so LoveSparkTheme.init() is intentionally not called. -->
  <script src="lib/lovespark-theme.js"></script>
  <script src="garden-sprites.js"></script>
  <script src="affirmations.js"></script>
  <script src="garden.js"></script>
  <script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
