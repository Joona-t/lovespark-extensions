<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Affirmation Cards</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
      retro
    </button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Affirmation Cards</div>
        <div class="header-sub" id="popupDesc">Kind words for your brain</div>
      </div>
    </header>

    <!-- Card display -->
    <div class="card-section" aria-live="polite">
      <div id="card" class="affirmation-card" role="article" aria-label="Affirmation card">
        <div id="cardCategory" class="card-category"></div>
        <div id="cardText" class="card-text">Loading...</div>
      </div>
      <div class="card-actions">
        <button id="favBtn" class="btn-action btn-fav" aria-label="Save to favorites" title="Save to favorites">
          <span id="favIcon" aria-hidden="true">&#9825;</span>
        </button>
        <button id="nextBtn" class="btn-action btn-next" aria-label="Next card" title="Next card">
          <span aria-hidden="true">&#10140;</span>
        </button>
      </div>
    </div>

    <!-- Favorites count -->
    <div class="fav-count-row">
      <span id="favCount" class="fav-count" aria-live="polite">0 favorites saved</span>
    </div>

    <!-- Stats -->
    <div class="stats-section" aria-label="Card statistics">
      <div class="stat-box" aria-label="Cards seen today">
        <div id="todayCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">today</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box" aria-label="Total cards seen">
        <div id="totalCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">total</div>
      </div>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
