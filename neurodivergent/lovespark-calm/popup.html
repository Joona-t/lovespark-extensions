<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>LoveSpark Calm</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">

  <!-- Header -->
  <header class="popup-header">
    <div class="header-left">
      <img src="mascot.png" alt="Sparky, the LoveSpark mascot" class="sparky" width="28" height="28">
      <h1 id="popupTitle" class="header-title">LoveSpark Calm</h1>
    </div>
    <div class="theme-dropdown">
      <button class="theme-dropdown-trigger" id="themeToggle" aria-haspopup="true" aria-expanded="false" aria-label="Change Theme">
        <span id="themeLabel" aria-live="polite">Retro Pink</span>
      </button>
      <div class="theme-dropdown-menu" id="themeMenu" role="menu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro" role="menuitem">Retro Pink</button>
        <button class="theme-option" data-theme="dark" role="menuitem">Dark</button>
        <button class="theme-option" data-theme="beige" role="menuitem">Beige</button>
        <button class="theme-option" data-theme="slate" role="menuitem">Slate</button>
      </div>
    </div>
  </header>

  <p id="popupDesc" class="sr-only">Toggle sensory-friendly calm mode for the current page</p>

  <!-- Main Toggle -->
  <section class="toggle-section" aria-label="Calm mode toggle">
    <div class="toggle-row">
      <span class="toggle-label" id="calmLabel">Calm Mode</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="calmToggle" aria-labelledby="calmLabel" role="switch">
        <span class="toggle-track" aria-hidden="true">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
    <p class="toggle-status" id="toggleStatus" aria-live="polite">Off</p>
  </section>

  <!-- Intensity -->
  <section class="intensity-section" aria-label="Calm intensity level">
    <h2 class="section-title">Intensity</h2>
    <div class="intensity-buttons" role="radiogroup" aria-label="Intensity level">
      <button class="intensity-btn" data-level="light" role="radio" aria-checked="false">Light</button>
      <button class="intensity-btn active" data-level="medium" role="radio" aria-checked="true">Medium</button>
      <button class="intensity-btn" data-level="full" role="radio" aria-checked="false">Full</button>
    </div>
    <div class="preview-strip" aria-hidden="true">
      <div class="preview-block" id="previewBlock">
        <span class="preview-text">Preview</span>
      </div>
    </div>
  </section>

  <!-- Per-site -->
  <section class="site-section" aria-label="Per-site settings">
    <h2 class="section-title">This Site</h2>
    <div class="site-buttons" role="radiogroup" aria-label="Site calm preference" id="siteButtons">
      <button class="site-btn" data-mode="always" role="radio" aria-checked="false">Always Calm</button>
      <button class="site-btn active" data-mode="default" role="radio" aria-checked="true">Default</button>
      <button class="site-btn" data-mode="never" role="radio" aria-checked="false">Never Calm</button>
    </div>
  </section>

  <!-- Stats -->
  <section class="stats-section" aria-label="Statistics">
    <p class="stat-line" aria-live="polite">Calming <strong id="siteCount">0</strong> sites right now</p>
  </section>

  <!-- Settings -->
  <details class="settings-panel">
    <summary class="settings-trigger">Settings</summary>
    <div class="settings-body">
      <div class="setting-group">
        <label class="setting-label" for="defaultIntensity">Default Intensity</label>
        <select id="defaultIntensity" class="setting-select">
          <option value="light">Light</option>
          <option value="medium" selected>Medium</option>
          <option value="full">Full</option>
        </select>
      </div>
      <div class="setting-group">
        <label class="setting-label" for="autoEnableDomains">Auto-enable on domains (one per line)</label>
        <textarea id="autoEnableDomains" class="setting-textarea" rows="3" placeholder="twitter.com&#10;reddit.com"></textarea>
      </div>
      <div class="setting-group">
        <label class="setting-label" for="autoDisableDomains">Auto-disable on domains (one per line)</label>
        <textarea id="autoDisableDomains" class="setting-textarea" rows="3" placeholder="docs.google.com"></textarea>
      </div>
    </div>
  </details>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>

</body>
</html>
