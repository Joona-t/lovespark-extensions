<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Context Switch</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeToggle" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
      retro
    </button>
    <div id="themeMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Context Switch</div>
        <div class="header-sub" id="popupDesc">Track your task switches</div>
      </div>
    </header>

    <main class="popup-content">
      <!-- Big switch button -->
      <div class="switch-section">
        <button id="switchBtn" class="switch-btn" aria-label="Log a context switch">
          <span class="switch-btn-icon" aria-hidden="true">I just switched</span>
        </button>
        <div id="switchFeedback" class="switch-feedback" hidden aria-live="polite"></div>
      </div>

      <!-- Weekly average -->
      <div class="avg-section" aria-label="Weekly average">
        <div class="avg-label">7-day average</div>
        <div id="weeklyAvg" class="avg-num" aria-live="polite">--</div>
        <div class="avg-unit">switches/day</div>
      </div>

      <!-- Recent switches -->
      <div id="recentSection" class="recent-section" hidden>
        <div class="recent-label">Recent switches today</div>
        <div id="recentList" class="recent-list" role="list"></div>
      </div>

      <div id="cuteMsg" class="cute-msg" aria-live="polite">Awareness is the first step</div>

      <!-- Stats -->
      <div class="stats-section" aria-label="Switch statistics">
        <div class="stat-box" aria-label="Switches today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Total switches">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">total</div>
        </div>
      </div>
    </main>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
