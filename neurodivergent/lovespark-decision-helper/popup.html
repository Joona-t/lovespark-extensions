<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Decision Helper</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky, the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Decision Helper</div>
        <div class="header-sub" id="popupDesc">LoveSpark Suite</div>
      </div>
      <div class="theme-dropdown">
        <button id="themeToggle" class="theme-dropdown-trigger"
                aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
          retro
        </button>
        <div id="themeMenu" class="theme-dropdown-menu" role="menu">
          <div class="theme-dropdown-header">Theme</div>
          <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
          <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
          <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
          <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
        </div>
      </div>
    </header>

    <main class="popup-content">
      <div id="cuteMsg" class="cute-msg" aria-live="polite">Can't decide? Let Sparky help!</div>

      <!-- Mode selector -->
      <div class="mode-tabs" role="tablist" aria-label="Decision mode">
        <button class="mode-tab active" role="tab" aria-selected="true" data-mode="wheel" id="tabWheel" aria-controls="panelWheel">Wheel</button>
        <button class="mode-tab" role="tab" aria-selected="false" data-mode="coin" id="tabCoin" aria-controls="panelCoin">Coin Flip</button>
      </div>

      <!-- Wheel panel -->
      <div id="panelWheel" class="panel" role="tabpanel" aria-labelledby="tabWheel">
        <div id="optionsList" class="options-list" aria-label="Options to choose from"></div>
        <div class="add-option-row">
          <input type="text" id="optionInput" class="option-input" placeholder="Add an option..." maxlength="40" aria-label="Type an option">
          <button id="addBtn" class="btn-add" aria-label="Add option">+</button>
        </div>
        <div class="wheel-area">
          <canvas id="wheelCanvas" width="200" height="200" aria-hidden="true"></canvas>
          <div id="wheelPointer" class="wheel-pointer" aria-hidden="true"></div>
        </div>
        <button id="spinBtn" class="btn-primary" disabled aria-label="Spin the wheel">Spin!</button>
      </div>

      <!-- Coin panel -->
      <div id="panelCoin" class="panel hidden" role="tabpanel" aria-labelledby="tabCoin">
        <div class="coin-area">
          <div id="coin" class="coin" aria-live="polite" aria-label="Coin showing heads">
            <div class="coin-face coin-heads">H</div>
            <div class="coin-face coin-tails">T</div>
          </div>
        </div>
        <button id="flipBtn" class="btn-primary" aria-label="Flip the coin">Flip!</button>
      </div>

      <!-- Result -->
      <div id="resultBox" class="result-box hidden" aria-live="assertive">
        <div id="resultText" class="result-text"></div>
        <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
      </div>

      <!-- Stats -->
      <div class="stats-section" aria-label="Decision statistics">
        <div class="stat-box" aria-label="Decisions today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Decisions total">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">total</div>
        </div>
      </div>
    </main>
    <footer class="popup-footer">LoveSpark Suite</footer>
  </div>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
</body>
</html>
