<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Focus Sounds</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">retro</button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Focus Sounds</div>
        <div class="header-sub" id="popupDesc">Ambient noise for your brain</div>
      </div>
    </header>

    <!-- Sound selector -->
    <div class="sound-grid" role="radiogroup" aria-label="Choose a sound">
      <button class="sound-btn" data-sound="white" aria-label="White noise">
        <span class="sound-emoji" aria-hidden="true">&#x2601;</span>
        <span class="sound-name">White</span>
      </button>
      <button class="sound-btn" data-sound="brown" aria-label="Brown noise">
        <span class="sound-emoji" aria-hidden="true">&#x1F30A;</span>
        <span class="sound-name">Brown</span>
      </button>
      <button class="sound-btn" data-sound="pink" aria-label="Pink noise">
        <span class="sound-emoji" aria-hidden="true">&#x1F338;</span>
        <span class="sound-name">Pink</span>
      </button>
      <button class="sound-btn" data-sound="rain" aria-label="Rain sounds">
        <span class="sound-emoji" aria-hidden="true">&#x1F327;</span>
        <span class="sound-name">Rain</span>
      </button>
      <button class="sound-btn" data-sound="fire" aria-label="Crackling fire">
        <span class="sound-emoji" aria-hidden="true">&#x1F525;</span>
        <span class="sound-name">Fire</span>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-section">
      <label for="volumeSlider" class="volume-label">Volume</label>
      <input type="range" id="volumeSlider" class="volume-slider"
             min="0" max="1" step="0.05" value="0.5" aria-label="Sound volume">
      <span id="volumeValue" class="volume-value">50%</span>
    </div>

    <!-- Play state -->
    <div id="playState" class="play-state" aria-live="polite">
      Tap a sound to start
    </div>

    <!-- Note -->
    <div class="play-note">Sound plays while popup is open</div>

    <!-- Stats -->
    <div class="stats-row">
      <span id="todayCount" class="stat-inline">0</span>
      <span class="stat-inline-label">sessions today</span>
      <span class="stat-sep">·</span>
      <span id="totalCount" class="stat-inline">0</span>
      <span class="stat-inline-label">total</span>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
