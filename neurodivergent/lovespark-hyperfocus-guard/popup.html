<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Hyperfocus Guard</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">retro</button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Hyperfocus Guard</div>
        <div class="header-sub" id="popupDesc">Gentle awareness, not shame</div>
      </div>
    </header>

    <!-- Current site info -->
    <div class="site-card" aria-live="polite">
      <div id="siteEmoji" class="site-emoji" aria-hidden="true">&#x1F310;</div>
      <div class="site-info">
        <div id="siteName" class="site-name">No site tracked</div>
        <div id="siteTime" class="site-time">0 min</div>
      </div>
    </div>

    <!-- Alert state -->
    <div id="alertBox" class="alert-box" hidden aria-live="assertive">
      <div class="alert-text">You've been here a while. Is this still what you want to be doing?</div>
      <button id="dismissBtn" class="btn-dismiss" aria-label="Acknowledge and reset timer">Got it, reset</button>
    </div>

    <!-- Threshold selector -->
    <div class="threshold-section">
      <label for="thresholdSelect" class="threshold-label">Alert after</label>
      <select id="thresholdSelect" class="threshold-select" aria-label="Alert threshold in minutes">
        <option value="15">15 min</option>
        <option value="30" selected>30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">2 hours</option>
      </select>
    </div>

    <!-- Enable toggle -->
    <div class="toggle-card">
      <span class="toggle-label-text">Tracking active</span>
      <label class="toggle-row">
        <input type="checkbox" id="enableToggle" checked aria-label="Enable hyperfocus tracking">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <span id="todayCount" class="stat-inline">0</span>
      <span class="stat-inline-label">alerts today</span>
      <span class="stat-sep">·</span>
      <span id="totalCount" class="stat-inline">0</span>
      <span class="stat-inline-label">total</span>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
