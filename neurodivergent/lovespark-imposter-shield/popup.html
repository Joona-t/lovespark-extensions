<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Imposter Shield</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">retro</button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="thought">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Imposter Shield</div>
        <div class="header-sub">You belong here</div>
      </div>
    </header>

    <!-- Counter-thought -->
    <div class="thought-card" aria-live="polite">
      <div id="thought" class="thought-text">Loading...</div>
    </div>
    <button id="newThoughtBtn" class="btn-new" aria-label="Show another counter-thought">Another truth</button>

    <!-- Evidence vault -->
    <div class="vault-section">
      <div class="vault-header">
        <span class="vault-label">Evidence vault</span>
        <span id="vaultCount" class="vault-count">0</span>
      </div>
      <button id="shakeBtn" class="btn-shake" aria-label="Shake vault for random evidence">Shake for proof</button>
      <div id="evidenceDisplay" class="evidence-display" hidden aria-live="polite">
        <div id="evidenceText" class="evidence-text"></div>
        <div id="evidenceDate" class="evidence-date"></div>
      </div>
    </div>

    <!-- Add evidence -->
    <div class="add-section">
      <div class="add-row">
        <input type="text" id="evidenceInput" class="evidence-input" placeholder="I accomplished..."
               aria-label="Add evidence of your competence" maxlength="200" autocomplete="off">
        <button id="addBtn" class="btn-add" aria-label="Add to vault">+</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <span id="todayCount" class="stat-inline">0</span>
      <span class="stat-inline-label">shields today</span>
      <span class="stat-sep">·</span>
      <span id="totalCount" class="stat-inline">0</span>
      <span class="stat-inline-label">total</span>
    </div>
    <div id="footerMount"></div>
  </div>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
