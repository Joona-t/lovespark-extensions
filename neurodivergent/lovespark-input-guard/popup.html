<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Input Guard</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Input Guard</div>
        <div class="header-sub" id="popupDesc">Never lose your words</div>
      </div>
      <div class="theme-dropdown">
        <button id="themeToggle" class="theme-dropdown-trigger"
                aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span>
        </button>
        <div id="themeMenu" class="theme-dropdown-menu" role="menu">
          <div class="theme-dropdown-header">Theme</div>
          <button class="theme-option active" role="menuitem" data-theme="retro" aria-label="Switch to Retro Pink theme">Retro Pink</button>
          <button class="theme-option" role="menuitem" data-theme="dark" aria-label="Switch to Dark Noir theme">Dark Noir</button>
          <button class="theme-option" role="menuitem" data-theme="beige" aria-label="Switch to Warm Beige theme">Warm Beige</button>
          <button class="theme-option" role="menuitem" data-theme="slate" aria-label="Switch to Cool Slate theme">Cool Slate</button>
        </div>
      </div>
    </header>

    <div class="status-section">
      <div id="statusIcon" class="status-icon" aria-hidden="true">&#x2728;</div>
      <div id="statusText" class="status-text" aria-live="polite">Active</div>
      <div id="cuteMsg" class="cute-msg">Guarding your words!</div>
      <label class="toggle-wrap">
        <input type="checkbox" id="enableToggle" checked aria-label="Enable Input Guard">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <main class="popup-content">
      <div class="stats-section" aria-label="Extension statistics">
        <div class="stat-box" aria-label="Saves today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">saves today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Total saves">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">all time</div>
        </div>
      </div>

      <div class="entries-section">
        <div class="entries-header">
          <span class="entries-title">Saved Text</span>
          <button id="clearAllBtn" class="btn-clear" aria-label="Clear all saved entries">Clear All</button>
        </div>
        <div id="entriesList" class="entries-list" aria-live="polite"></div>
      </div>
    </main>

    <footer class="popup-footer">
      <span>LoveSpark Suite</span>
      <button id="settingsBtn" class="btn-settings" aria-label="Open settings">&#x2699; Settings</button>
    </footer>
  </div>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
