<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Med Tracker — Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div class="report-container">

    <header class="report-header no-print">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="report-mascot">
      <div>
        <h1 class="report-title">Medication Report</h1>
        <span class="report-sub">LoveSpark Med Tracker</span>
      </div>
    </header>

    <div class="report-controls no-print" role="toolbar" aria-label="Report controls">
      <label class="form-label" id="rangeLabel">Date range:</label>
      <div class="range-btns" role="radiogroup" aria-labelledby="rangeLabel">
        <button class="range-btn active" data-days="30" role="radio" aria-checked="true">30 days</button>
        <button class="range-btn" data-days="60" role="radio" aria-checked="false">60 days</button>
        <button class="range-btn" data-days="90" role="radio" aria-checked="false">90 days</button>
      </div>
      <button class="btn-pink" id="printBtn" aria-label="Print report">🖨️ Print Report</button>
    </div>

    <div id="reportContent">
      <section class="report-section">
        <h2 class="section-title">Medications</h2>
        <div id="medTable"></div>
      </section>

      <section class="report-section">
        <h2 class="section-title">Adherence</h2>
        <div id="adherenceStats"></div>
      </section>

      <section class="report-section">
        <h2 class="section-title">Calendar</h2>
        <div id="reportCalendar"></div>
      </section>

      <section class="report-section" id="moodSection" style="display:none">
        <h2 class="section-title">Mood Patterns</h2>
        <div id="moodStats"></div>
      </section>

      <footer class="report-footer">
        <p>Generated by LoveSpark Med Tracker on <span id="reportDate"></span></p>
        <p class="disclaimer">This is a personal tracking tool, not a medical device. Data is self-reported.</p>
      </footer>
    </div>
  </div>

  <script type="module" src="report.js"></script>
</body>
</html>
