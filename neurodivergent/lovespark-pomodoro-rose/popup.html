<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Pomodoro Rose</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">retro</button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Pomodoro Rose</div>
        <div class="header-sub" id="popupDesc">Grow roses by focusing</div>
      </div>
    </header>

    <!-- Timer display (active session) -->
    <div id="timerSection" class="timer-section" hidden>
      <div id="phaseLabel" class="phase-label" aria-live="polite">Working</div>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-bg" cx="50" cy="50" r="42" />
          <circle id="ringProgress" class="ring-fill" cx="50" cy="50" r="42" />
        </svg>
        <div id="timerText" class="timer-text">25:00</div>
      </div>
      <button id="stopBtn" class="btn-stop" aria-label="Stop timer">Stop</button>
    </div>

    <!-- Preset picker (idle) -->
    <div id="presetSection" class="preset-section">
      <div class="preset-grid" role="group" aria-label="Pomodoro presets">
        <button class="btn-preset" data-preset="short" aria-label="Short: 15 work, 5 break">
          <span class="preset-time">15/5</span>
          <span class="preset-name">Short</span>
        </button>
        <button class="btn-preset active" data-preset="classic" aria-label="Classic: 25 work, 5 break">
          <span class="preset-time">25/5</span>
          <span class="preset-name">Classic</span>
        </button>
        <button class="btn-preset" data-preset="long" aria-label="Long: 50 work, 10 break">
          <span class="preset-time">50/10</span>
          <span class="preset-name">Long</span>
        </button>
      </div>
      <button id="startBtn" class="btn-start" aria-label="Start Pomodoro">Start Focus</button>
    </div>

    <!-- Rose garden -->
    <div class="garden-section" aria-label="Today's rose garden">
      <div class="garden-label">Today's garden</div>
      <div id="roseGarden" class="rose-garden" role="list"></div>
      <div id="emptyGarden" class="empty-garden">No roses yet. Complete a session to grow one.</div>
    </div>

    <!-- Stats -->
    <div class="stats-section" aria-label="Pomodoro statistics">
      <div class="stat-box" aria-label="Sessions today">
        <div id="todayCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">today</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box" aria-label="Total sessions">
        <div id="totalCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">total</div>
      </div>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
