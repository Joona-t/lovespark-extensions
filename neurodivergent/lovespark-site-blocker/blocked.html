<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked by LoveSpark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EC 50%, #FFF5F8 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2D1B33;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 40px 30px;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    .breathe-hint {
      font-size: 13px; color: #E8457C; font-weight: 500;
      padding: 12px 20px;
      background: rgba(232, 69, 124, 0.08);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .back-btn {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .back-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji" aria-hidden="true">&#x1F6E1;</div>
    <div class="title">Focus mode active</div>
    <div class="subtitle">LoveSpark blocked this site to help you stay focused. You chose to block it for a reason.</div>
    <div class="breathe-hint">Take a breath. What were you working on?</div>
    <button class="back-btn" onclick="history.back()">Go back</button>
  </div>
</body>
</html>
