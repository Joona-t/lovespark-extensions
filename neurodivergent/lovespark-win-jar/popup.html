<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Win Jar</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeToggle" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
      <span id="themeLabel" aria-live="polite">Retro Pink</span>
    </button>
    <div id="themeMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Win Jar</div>
        <div class="header-sub" id="popupDesc">Collect your victories</div>
      </div>
    </header>

    <!-- Jar display -->
    <div class="jar-section" aria-live="polite">
      <div id="jarEmoji" class="jar-emoji" aria-hidden="true">&#x1FAD9;</div>
      <div id="jarLabel" class="jar-label">Empty jar</div>
      <div id="jarCount" class="jar-count">0 wins collected</div>
      <div id="streakText" class="streak-text"></div>
    </div>

    <!-- Shake button -->
    <button id="shakeBtn" class="btn-shake" aria-label="Shake the jar for a random win">
      <span aria-hidden="true">&#x1F389;</span> Shake for a win
    </button>

    <!-- Random win display -->
    <div id="randomWin" class="random-win" hidden aria-live="polite">
      <div class="random-win-label">Remember this?</div>
      <div id="randomWinText" class="random-win-text"></div>
      <div id="randomWinDate" class="random-win-date"></div>
    </div>

    <!-- Celebration message -->
    <div id="celebration" class="celebration" hidden aria-live="polite"></div>

    <!-- Add win input -->
    <div class="add-section">
      <div class="add-row">
        <input type="text" id="winInput" class="win-input" placeholder="I just..."
               aria-label="Describe your win" maxlength="200" autocomplete="off">
        <button id="addBtn" class="btn-add" aria-label="Add win to jar">+</button>
      </div>
    </div>

    <!-- Today's wins -->
    <div id="todayWinsSection" class="today-wins" hidden>
      <div class="today-wins-label">Today's wins</div>
      <div id="todayWinsList" class="today-wins-list" role="list" aria-live="polite"></div>
    </div>

    <!-- Stats -->
    <div class="stats-section" aria-label="Win statistics">
      <div class="stat-box" aria-label="Wins logged today">
        <div id="todayCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">today</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box" aria-label="Total wins logged">
        <div id="totalCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">total</div>
      </div>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
