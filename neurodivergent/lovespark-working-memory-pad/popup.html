<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Working Memory Pad</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeDropdownTrigger" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">retro</button>
    <div id="themeDropdownMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>

  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky the LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Working Memory Pad</div>
        <div class="header-sub" id="popupDesc">Pin things you'll forget</div>
      </div>
    </header>

    <!-- 3 pinned pads -->
    <div class="pads-section" aria-label="Memory pads">
      <div class="pad-item">
        <span class="pad-pin" aria-hidden="true">&#x1F4CC;</span>
        <input type="text" id="pad0" class="pad-input" placeholder="Pin a note here..."
               aria-label="Memory pad 1" maxlength="200" autocomplete="off">
        <button class="pad-clear" data-pad="0" aria-label="Clear pad 1">&#x00D7;</button>
      </div>
      <div class="pad-item">
        <span class="pad-pin" aria-hidden="true">&#x1F4CC;</span>
        <input type="text" id="pad1" class="pad-input" placeholder="Phone number, password hint..."
               aria-label="Memory pad 2" maxlength="200" autocomplete="off">
        <button class="pad-clear" data-pad="1" aria-label="Clear pad 2">&#x00D7;</button>
      </div>
      <div class="pad-item">
        <span class="pad-pin" aria-hidden="true">&#x1F4CC;</span>
        <input type="text" id="pad2" class="pad-input" placeholder="What were you about to do?"
               aria-label="Memory pad 3" maxlength="200" autocomplete="off">
        <button class="pad-clear" data-pad="2" aria-label="Clear pad 3">&#x00D7;</button>
      </div>
    </div>

    <!-- Hint -->
    <div class="hint-text">Notes persist until you clear them. Badge shows active count.</div>

    <!-- Stats -->
    <div class="stats-row">
      <span id="todayCount" class="stat-inline">0</span>
      <span class="stat-inline-label">notes today</span>
      <span class="stat-sep">·</span>
      <span id="totalCount" class="stat-inline">0</span>
      <span class="stat-inline-label">total</span>
    </div>

    <div id="footerMount"></div>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
