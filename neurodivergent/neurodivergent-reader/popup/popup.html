<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neurodivergent Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <img src="../mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="36" height="36">
        <div class="header-text">
          <span class="header-title">Neurodivergent<br>Reader</span>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">&#x2699;&#xFE0F;</button>
    </header>

    <!-- Status -->
    <section class="status-section">
      <p id="cute-msg" class="cute-msg">Browse in peace! &#x1F495;</p>
      <label class="toggle-row">
        <span class="toggle-label">Enable Reader</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="master-toggle" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>
    </section>

    <!-- Features -->
    <section class="features-card">
      <h2 class="card-title">&#x2728; Features</h2>

      <label class="toggle-row">
        <span class="toggle-label">&#x1F524; Reading Font</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="font-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>

      <div class="font-picker-row hidden" id="font-picker-row">
        <select id="font-select" class="font-select">
          <option value="OpenDyslexic">OpenDyslexic</option>
          <option value="Lexend">Lexend</option>
          <option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option>
          <option value="system">System Default</option>
        </select>
      </div>

      <label class="toggle-row">
        <span class="toggle-label">&#x1F4CF; Reading Ruler</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="ruler-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>

      <label class="toggle-row">
        <span class="toggle-label">&#x1F50D; Paragraph Focus</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="focus-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>

      <label class="toggle-row">
        <span class="toggle-label">&#x1F6E1;&#xFE0F; Hide Distractions</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="distraction-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>
    </section>

    <!-- Current site -->
    <section class="site-section">
      <div class="site-row">
        <span class="site-icon">&#x1F4CD;</span>
        <span id="site-domain" class="site-domain">&mdash;</span>
        <button id="site-disable-btn" class="site-btn">&#x2716; Disable here</button>
      </div>
    </section>

    <footer class="popup-footer">
      <span class="footer-brand">LoveSpark Suite &#x1F495;</span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
