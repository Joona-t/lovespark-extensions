<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Bubbles</title>
  <link rel="stylesheet" href="../lib/lovespark-fonts.css">
  <link rel="stylesheet" href="../lib/lovespark-base.css">
  <link rel="stylesheet" href="../lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">

    <header class="popup-header">
      <div class="header-left">
        <img src="../mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="36" height="36">
        <div class="header-text">
          <h1 class="header-title" id="popupTitle">Study Bubbles</h1>
          <span class="subtitle" id="popupDesc">by LoveSpark</span>
        </div>
      </div>
      <div class="theme-dropdown" id="themeDropdown">
        <button class="theme-dropdown-trigger" id="themeToggle" aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span> &#x25BE;
        </button>
        <div class="theme-dropdown-menu" id="themeMenu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option" data-theme="retro">Retro Pink</button>
          <button class="theme-option" data-theme="dark">Dark</button>
          <button class="theme-option" data-theme="beige">Beige</button>
          <button class="theme-option" data-theme="slate">Slate</button>
        </div>
      </div>
    </header>

    <section class="status-section">
      <p id="cute-msg" class="cute-msg">Your knowledge base grows with you.</p>
      <label class="toggle-row">
        <span class="toggle-label">Enable Study Bubbles</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="master-toggle" aria-label="Enable Study Bubbles" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>
    </section>

    <section class="stats-card">
      <div class="stat">
        <span class="stat-value" id="bubble-count">0</span>
        <span class="stat-label">bubbles</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="due-count">0</span>
        <span class="stat-label">due today</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="review-count">0</span>
        <span class="stat-label">total reviews</span>
      </div>
    </section>

    <!-- Tab nav -->
    <nav class="tab-nav" role="tablist">
      <button class="tab-btn active" data-tab="study" role="tab" aria-selected="true">Study</button>
      <button class="tab-btn" data-tab="bubbles" role="tab">All Bubbles</button>
      <button class="tab-btn" data-tab="add" role="tab">+ Add</button>
    </nav>

    <!-- Tab: Study (review due cards) -->
    <section class="tab-panel active" data-panel="study">
      <div id="study-area">
        <div class="card study-card" id="study-card">
          <p class="study-front" id="study-front">No bubbles due!</p>
          <p class="study-back hidden" id="study-back"></p>
          <p class="study-source hidden" id="study-source"></p>
        </div>
        <div class="study-actions hidden" id="study-actions">
          <button class="btn-reveal" id="reveal-btn">Reveal</button>
          <div class="rating-row hidden" id="rating-row">
            <button class="btn-rate btn-rate-again" data-quality="1">Again</button>
            <button class="btn-rate btn-rate-hard" data-quality="3">Hard</button>
            <button class="btn-rate btn-rate-good" data-quality="4">Good</button>
            <button class="btn-rate btn-rate-easy" data-quality="5">Easy</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab: All Bubbles -->
    <section class="tab-panel" data-panel="bubbles">
      <div class="bubble-list" id="bubble-list"></div>
    </section>

    <!-- Tab: Add manual bubble -->
    <section class="tab-panel" data-panel="add">
      <div class="card">
        <label class="field-label" for="add-front">Front (question/term)</label>
        <textarea id="add-front" class="text-area" rows="3" placeholder="What is..."></textarea>
        <label class="field-label" for="add-back">Back (answer/definition)</label>
        <textarea id="add-back" class="text-area" rows="3" placeholder="It is..."></textarea>
        <button class="btn-pink btn-full" id="add-bubble-btn">Create Bubble</button>
      </div>
    </section>

  </div>

  <script src="../lib/lovespark-theme.js"></script>
  <script src="../lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
