<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time-Softener</title>
  <link rel="stylesheet" href="../lib/lovespark-fonts.css">
  <link rel="stylesheet" href="../lib/lovespark-base.css">
  <link rel="stylesheet" href="../lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <header class="popup-header">
      <div class="header-left">
        <img src="../mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="36" height="36">
        <div class="header-text">
          <h1 class="header-title">Time-Softener</h1>
          <span class="subtitle">by LoveSpark</span>
        </div>
      </div>
      <div class="theme-dropdown" id="themeDropdown">
        <button class="theme-dropdown-trigger" id="themeToggle">
          <span id="themeLabel">Retro Pink</span> &#x25BE;
        </button>
        <div class="theme-dropdown-menu" id="themeMenu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option" data-theme="retro">Retro Pink</button>
          <button class="theme-option" data-theme="dark">Dark</button>
          <button class="theme-option" data-theme="beige">Beige</button>
          <button class="theme-option" data-theme="slate">Slate</button>
        </div>
      </div>
    </header>

    <section class="status-section">
      <p id="cute-msg" class="cute-msg">Discipline should feel like tending a garden.</p>
      <label class="toggle-row">
        <span class="toggle-label">Enable Time-Softener</span>
        <span class="toggle-wrap">
          <input type="checkbox" id="master-toggle" aria-label="Enable Time-Softener" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
      </label>
    </section>

    <section class="stats-card">
      <div class="stat">
        <span class="stat-value" id="today-count">0</span>
        <span class="stat-label">pauses today</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="total-count">0</span>
        <span class="stat-label">total pauses</span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Pause Duration</h2>
      <div class="slider-row">
        <input type="range" id="pause-duration" min="3" max="15" value="5" class="slider">
        <span class="slider-value" id="pause-value">5s</span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Cooldown (minutes)</h2>
      <p class="card-desc">Wait this long before showing again on the same site</p>
      <div class="slider-row">
        <input type="range" id="cooldown-duration" min="5" max="120" step="5" value="15" class="slider">
        <span class="slider-value" id="cooldown-value">15m</span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Softened Sites</h2>
      <p class="card-desc">Sites that trigger a gentle pause</p>
      <div class="site-input-row">
        <input type="text" id="site-input" placeholder="example.com" class="text-input">
        <button class="btn-pink" id="add-site-btn">Add</button>
      </div>
      <ul class="site-list" id="site-list"></ul>
    </section>

  </div>

  <script src="../lib/lovespark-theme.js"></script>
  <script src="../lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
