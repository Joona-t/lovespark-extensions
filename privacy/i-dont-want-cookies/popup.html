<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Don't Want Cookies</title>
<link rel="stylesheet" href="lib/lovespark-fonts.css">
<link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>

<div id="root">

  <!-- Header -->
  <header>
    <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="32" height="32">
    <span class="logo-text">🍪 I Don't Want<br><span class="logo-sub">Cookies 💕</span></span>
    <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
  </header>

  <!-- Status -->
  <section class="status-section">
    <div id="cookie-icon" class="cookie-icon" aria-live="polite">🚫</div>
    <div id="status-text" class="status-text">Cookie-Free! ✨</div>
    <p id="cute-msg" class="cute-msg">Cookie-free zone! 💕</p>
    <label class="toggle-wrap" aria-label="Enable or disable cookie banner blocking">
      <input type="checkbox" id="main-toggle" checked>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </label>
  </section>

  <!-- Stats -->
  <section class="stats-section">
    <div class="stat-box">
      <div id="stat-today" class="stat-num">0</div>
      <div class="stat-label">hidden today</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-box">
      <div id="stat-total" class="stat-num">0</div>
      <div class="stat-label">hidden total</div>
    </div>
  </section>

  <!-- Current site -->
  <section class="site-section">
    <div class="site-row">
      <span class="site-icon">📍</span>
      <span id="site-domain" class="site-domain">—</span>
      <button id="whitelist-btn" class="wl-btn">☆ Allow</button>
    </div>
  </section>

  <!-- Auto-decline row -->
  <section class="autodecline-section">
    <div class="ad-row">
      <div class="ad-text">
        <span class="ad-label">Auto-decline cookies</span>
        <span class="ad-desc">Clicks "Reject All" for you</span>
      </div>
      <label class="toggle-wrap small" aria-label="Toggle auto-decline">
        <input type="checkbox" id="auto-decline-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <button id="settings-footer-btn" class="footer-link">⚙️ Settings</button>
    <span class="footer-brand">LoveSpark Suite 💕</span>
  </footer>

</div>

<script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
