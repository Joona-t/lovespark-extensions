<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Download Guard</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky -- LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <span class="header-title" id="popupTitle">LoveSpark</span>
        <span class="header-sub" id="popupDesc">Download Guard</span>
      </div>
      <div class="theme-dropdown" id="themeDropdown">
        <button class="theme-dropdown-trigger" id="themeToggle"
                aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span>
        </button>
        <div class="theme-dropdown-menu" id="themeMenu" role="menu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option" role="menuitem" data-theme="retro">Retro Pink</button>
          <button class="theme-option" role="menuitem" data-theme="dark">Dark</button>
          <button class="theme-option" role="menuitem" data-theme="beige">Beige</button>
          <button class="theme-option" role="menuitem" data-theme="slate">Slate</button>
        </div>
      </div>
    </header>

    <section class="status-section">
      <div id="statusIcon" class="status-icon" aria-hidden="true">✨</div>
      <div id="statusText" class="status-text" aria-live="polite">Guarding downloads!</div>
      <p id="cuteMsg" class="cute-msg">Safe downloads only!</p>
      <label class="toggle-wrap">
        <input type="checkbox" id="enableToggle" checked aria-label="Enable extension">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </section>

    <section id="warningSection" class="warning-section hidden" aria-live="assertive" aria-label="Download warning">
      <div class="warning-icon" aria-hidden="true">&#9888;</div>
      <div class="warning-title">Suspicious download paused!</div>
      <div id="warningFile" class="warning-file"></div>
      <div id="warningExt" class="warning-ext"></div>
      <div class="warning-buttons">
        <button id="allowBtn" class="warning-btn allow-btn">Allow download</button>
        <button id="cancelBtn" class="warning-btn cancel-btn">Cancel</button>
      </div>
    </section>

    <section class="info-section" aria-label="Monitored file types">
      <div class="info-label">Watching for:</div>
      <div class="info-tags">
        <span class="info-tag">.exe</span>
        <span class="info-tag">.bat</span>
        <span class="info-tag">.scr</span>
        <span class="info-tag">.vbs</span>
        <span class="info-tag">.msi</span>
        <span class="info-tag">.ps1</span>
        <span class="info-tag">+11 more</span>
      </div>
    </section>

    <section class="stats-section" aria-label="Extension statistics">
      <div class="stat-box" aria-label="Caught today">
        <div id="todayCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">caught today</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-box" aria-label="Caught total">
        <div id="totalCount" class="stat-num" aria-live="polite">0</div>
        <div class="stat-label">caught total</div>
      </div>
    </section>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
