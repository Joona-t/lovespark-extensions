<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Fingerprint Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <img src="icons/icon-48.png" alt="Shield" class="header-icon">
      <h1>Fingerprint Shield</h1>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
    </header>

    <div class="status-card" id="statusCard">
      <span class="status-icon" id="statusIcon">🛡️</span>
      <span class="status-text" id="statusText">Shield Active</span>
      <button class="toggle-switch active" id="toggleBtn" aria-label="Toggle shield"></button>
    </div>

    <div class="stats-card">
      <div class="stats-row">
        <span class="stats-label">Spoofed today</span>
        <span class="stats-value" id="todayCount">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Total spoofed</span>
        <span class="stats-value" id="totalCount">0</span>
      </div>
    </div>

    <div class="protected-card">
      <span class="protected-label">Protected surfaces</span>
      <span class="protected-list">Canvas · WebGL · Audio · Fonts · Screen · Hardware · Battery · Media · Timing</span>
    </div>

    <footer class="popup-footer">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot">
      <span class="footer-text">invisible to trackers ✨</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
