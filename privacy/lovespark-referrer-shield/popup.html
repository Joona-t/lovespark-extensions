<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveSpark Referrer Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="popup-container">

  <!-- Header -->
  <header class="popup-header">
    <span class="header-icon">🛡️</span>
    <span class="header-title">Referrer Shield</span>
    <button id="themeTab" class="theme-tab" title="Cycle theme" aria-label="Cycle theme">retro</button>
  </header>

  <!-- Mode selector -->
  <section class="mode-section">
    <label class="mode-option" data-mode="strip">
      <input type="radio" name="mode" value="strip">
      <div class="mode-card">
        <div class="mode-title">Strip all</div>
        <div class="mode-desc">Remove Referer completely</div>
      </div>
    </label>

    <label class="mode-option" data-mode="origin">
      <input type="radio" name="mode" value="origin" checked>
      <div class="mode-card">
        <div class="mode-title">Origin only</div>
        <div class="mode-desc">Send site name, not page</div>
      </div>
    </label>

    <label class="mode-option" data-mode="off">
      <input type="radio" name="mode" value="off">
      <div class="mode-card">
        <div class="mode-title">Off</div>
        <div class="mode-desc">Browser default behavior</div>
      </div>
    </label>
  </section>

  <!-- Status card -->
  <section class="stats-card">
    <div class="stats-row">
      <span class="stats-label" id="status-icon">🛡️</span>
      <span class="stats-value" id="status-text">Shield active</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Streak</span>
      <span class="stats-value" id="streak-value">0 days</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Mode</span>
      <span class="stats-value" id="mode-value">Origin only</span>
    </div>
  </section>

  <!-- Cute message -->
  <p class="cute-msg" id="cute-msg">Browse in peace! 💕</p>

  <!-- Whitelist -->
  <section class="whitelist-section">
    <div class="whitelist-header">Whitelisted sites</div>
    <ul class="whitelist-list" id="whitelist-list">
      <!-- populated by JS -->
    </ul>
    <div class="whitelist-empty" id="whitelist-empty">No whitelisted sites yet 🌸</div>
    <div class="whitelist-add">
      <input type="text" id="wl-input" class="wl-input" placeholder="example.com" autocomplete="off">
      <button id="wl-add-btn" class="btn-pink btn-sm">+ Add</button>
    </div>
  </section>

  <!-- Footer -->
  <footer class="popup-footer">
    <span class="footer-brand">LoveSpark Suite 💕</span>
  </footer>

</div>

<script src="lib/browser-polyfill.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
