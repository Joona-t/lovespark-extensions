<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Twitch AdBlock</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popup-title" aria-describedby="status-text">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="32" height="32">
      <span id="popup-title">Twitch AdBlock</span>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle" aria-haspopup="true" aria-expanded="false" aria-label="Change theme">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
      <button class="settings-btn" id="settings-btn" title="Settings" aria-label="Open settings">⚙️</button>
    </header>

    <div class="status-section">
      <div class="status-text" id="status-text">Protected! ✨</div>
      <label class="toggle-switch" id="main-toggle">
        <input type="checkbox" id="toggle-input" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <main class="popup-content">
      <div class="stats-card">
        <div class="stats-row">
          <span class="stats-label">Ads blocked today</span>
          <span class="stats-value" id="stat-today">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Total blocked</span>
          <span class="stats-value" id="stat-total">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Time saved</span>
          <span class="stats-value stats-value--sm" id="stat-time">0s</span>
        </div>
      </div>
      <p class="message" id="cute-msg"></p>
    </main>

  </div>
  <script src="lib/browser-polyfill.min.js"></script>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
