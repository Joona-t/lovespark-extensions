<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Twitch AdBlock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <span class="popup-icon" id="shield-icon">🛡️</span>
      <span>Twitch AdBlock</span>
      <button class="settings-btn" id="settings-btn" title="Settings">⚙️</button>
    </header>

    <div class="status-section">
      <div class="status-text" id="status-text">Protected! ✨</div>
      <label class="toggle-switch" id="main-toggle">
        <input type="checkbox" id="toggle-input" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <main class="popup-content">
      <div class="stats-card">
        <div class="stats-row">
          <span class="stats-label">Ads blocked today</span>
          <span class="stats-value" id="stat-today">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Total blocked</span>
          <span class="stats-value" id="stat-total">0</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Time saved</span>
          <span class="stats-value stats-value--sm" id="stat-time">0s</span>
        </div>
      </div>
      <p class="message" id="cute-msg"></p>
    </main>

    <footer class="popup-footer">LoveSpark Suite 💕</footer>
  </div>
  <script src="lib/browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
