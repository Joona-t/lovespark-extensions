<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Are You Cooked?</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      min-height: 200px;
      font-family: 'DM Mono', monospace;
      background-color: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease;
      overflow: hidden;
    }

    .container {
      width: 100%;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .title {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ff69b4;
      opacity: 0.5;
    }

    .count-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-count {
      font-size: 64px;
      font-weight: 500;
      line-height: 1;
      color: #ff69b4;
      text-shadow:
        0 0 20px rgba(255, 105, 180, 0.6),
        0 0 40px rgba(255, 105, 180, 0.3);
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    .tabs-label {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #ff69b4;
      opacity: 0.6;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff69b4, transparent);
      opacity: 0.4;
    }

    .verdict {
      font-size: 13px;
      font-weight: 400;
      font-style: italic;
      color: #ff69b4;
      line-height: 1.5;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.4);
      transition: color 0.4s ease;
      min-height: 20px;
    }

    /* ── Mascot ── */
    .mascot-wrap {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mascot {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 16px;
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    /* panic-0: calm — no effect */

    /* panic-1: slightly concerned (5–9 tabs) */
    .mascot.panic-1 {
      animation: mascot-wobble 2.5s ease-in-out infinite;
    }

    /* panic-2: worried (10–14 tabs) */
    .mascot.panic-2 {
      animation: mascot-wobble 1.2s ease-in-out infinite;
      filter: brightness(1.08) saturate(1.1);
    }

    /* panic-3: deeply concerned (15–19 tabs) */
    .mascot.panic-3 {
      animation: mascot-wobble 0.7s ease-in-out infinite;
      filter: brightness(1.15) saturate(1.2) hue-rotate(8deg);
    }

    /* panic-4: panicking (20–24 tabs) */
    .mascot.panic-4 {
      animation: mascot-shake 0.4s ease-in-out infinite;
      filter: brightness(1.2) saturate(1.35) hue-rotate(15deg);
    }

    /* panic-5: screaming (25–29 tabs) */
    .mascot.panic-5 {
      animation: mascot-shake 0.25s linear infinite;
      filter: brightness(1.3) saturate(1.5) hue-rotate(22deg);
      transform-origin: center;
    }

    /* panic-6: fully cooked (30+ tabs) */
    .mascot.panic-6 {
      animation: mascot-chaos 0.18s linear infinite;
      filter: brightness(1.5) saturate(2) hue-rotate(35deg) contrast(1.1);
    }

    @keyframes mascot-wobble {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-4deg); }
      75%       { transform: rotate(4deg); }
    }

    @keyframes mascot-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25%       { transform: translateX(-4px) rotate(-3deg); }
      75%       { transform: translateX(4px) rotate(3deg); }
    }

    @keyframes mascot-chaos {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      20%  { transform: translate(-3px, -2px) rotate(-4deg) scale(1.04); }
      40%  { transform: translate(3px, 1px) rotate(4deg) scale(0.97); }
      60%  { transform: translate(-2px, 2px) rotate(-2deg) scale(1.02); }
      80%  { transform: translate(2px, -1px) rotate(3deg) scale(0.98); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mascot { animation: none !important; }
    }

    /* State: fine */
    body.state-fine .tab-count,
    body.state-fine .verdict,
    body.state-fine .tabs-label,
    body.state-fine .title,
    body.state-fine .divider {
      color: #a8e6a3;
      background: unset;
    }
    body.state-fine .tab-count {
      text-shadow:
        0 0 20px rgba(168, 230, 163, 0.5),
        0 0 40px rgba(168, 230, 163, 0.2);
      color: #a8e6a3;
    }
    body.state-fine .verdict {
      color: #a8e6a3;
      text-shadow: 0 0 12px rgba(168, 230, 163, 0.35);
    }
    body.state-fine .divider {
      background: linear-gradient(90deg, transparent, #a8e6a3, transparent);
    }

    /* State: spicy */
    body.state-spicy .tab-count,
    body.state-spicy .verdict,
    body.state-spicy .tabs-label,
    body.state-spicy .title {
      color: #ffb347;
    }
    body.state-spicy .tab-count {
      text-shadow:
        0 0 20px rgba(255, 179, 71, 0.55),
        0 0 40px rgba(255, 179, 71, 0.25);
      color: #ffb347;
    }
    body.state-spicy .verdict {
      color: #ffb347;
      text-shadow: 0 0 12px rgba(255, 179, 71, 0.4);
    }
    body.state-spicy .divider {
      background: linear-gradient(90deg, transparent, #ffb347, transparent);
    }

    /* State: cooked */
    body.state-cooked .tab-count,
    body.state-cooked .verdict,
    body.state-cooked .tabs-label,
    body.state-cooked .title {
      color: #ff6b6b;
    }
    body.state-cooked .tab-count {
      text-shadow:
        0 0 20px rgba(255, 107, 107, 0.6),
        0 0 40px rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
    }
    body.state-cooked .verdict {
      color: #ff6b6b;
      text-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
    }
    body.state-cooked .divider {
      background: linear-gradient(90deg, transparent, #ff6b6b, transparent);
    }

    /* State: 911 */
    body.state-911 .tab-count,
    body.state-911 .verdict,
    body.state-911 .tabs-label,
    body.state-911 .title {
      color: #ff2d55;
    }
    body.state-911 .tab-count {
      text-shadow:
        0 0 20px rgba(255, 45, 85, 0.7),
        0 0 50px rgba(255, 45, 85, 0.35),
        0 0 80px rgba(255, 45, 85, 0.15);
      color: #ff2d55;
    }
    body.state-911 .verdict {
      color: #ff2d55;
      text-shadow: 0 0 12px rgba(255, 45, 85, 0.5);
    }
    body.state-911 .divider {
      background: linear-gradient(90deg, transparent, #ff2d55, transparent);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="title">are you cooked?</span>
    <div class="mascot-wrap">
      <img class="mascot panic-0" id="mascot" src="cooked_mascot.png" alt="mascot" />
    </div>
    <div class="count-wrapper">
      <div class="tab-count" id="tabCount">—</div>
      <div class="tabs-label">tabs open</div>
    </div>
    <div class="divider"></div>
    <div class="verdict" id="verdict">counting...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
