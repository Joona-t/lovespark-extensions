<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Are You Cooked?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <img class="header-mascot" src="mascot.png" alt="Sparky — LoveSpark mascot" />
      <span class="header-title">Are You Cooked?</span>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
    </header>

    <main class="popup-content">
      <div class="stats-card">
        <div class="mascot-wrap">
          <img class="mascot panic-0" id="mascot" src="mascot.png" alt="Sparky — LoveSpark mascot" />
        </div>
        <div class="count-wrapper">
          <div class="tab-count" id="tabCount" role="status">—</div>
          <div class="tabs-label">tabs open</div>
        </div>
        <div class="divider"></div>
        <div class="verdict" id="verdict" aria-live="polite">counting...</div>
      </div>
    </main>

    <footer class="popup-footer">
      Part of LoveSpark Suite 💕
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
