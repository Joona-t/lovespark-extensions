<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Are You Cooked?</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      min-height: 200px;
      font-family: 'DM Mono', monospace;
      background-color: #fce4ec;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease;
      overflow: hidden;
    }

    .container {
      width: 100%;
      padding: 24px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .title {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c2185b;
      opacity: 0.6;
    }

    /* ── Mascot ── */
    .mascot-wrap {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mascot {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    /* panic-0: calm — no effect */

    /* panic-1: slightly concerned (5–9 tabs) */
    .mascot.panic-1 {
      animation: mascot-wobble 2.5s ease-in-out infinite;
    }

    /* panic-2: worried (10–14 tabs) */
    .mascot.panic-2 {
      animation: mascot-wobble 1.2s ease-in-out infinite;
      filter: saturate(1.15);
    }

    /* panic-3: deeply concerned (15–19 tabs) */
    .mascot.panic-3 {
      animation: mascot-wobble 0.7s ease-in-out infinite;
      filter: saturate(1.3) hue-rotate(8deg);
    }

    /* panic-4: panicking (20–24 tabs) */
    .mascot.panic-4 {
      animation: mascot-shake 0.4s ease-in-out infinite;
      filter: saturate(1.5) hue-rotate(15deg);
    }

    /* panic-5: screaming (25–29 tabs) */
    .mascot.panic-5 {
      animation: mascot-shake 0.22s linear infinite;
      filter: saturate(1.8) hue-rotate(22deg) brightness(1.15);
    }

    /* panic-6: fully cooked (30+ tabs) */
    .mascot.panic-6 {
      animation: mascot-chaos 0.18s linear infinite;
      filter: saturate(2.2) hue-rotate(35deg) brightness(1.25) contrast(1.1);
    }

    @keyframes mascot-wobble {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-5deg); }
      75%       { transform: rotate(5deg); }
    }

    @keyframes mascot-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25%       { transform: translateX(-5px) rotate(-4deg); }
      75%       { transform: translateX(5px) rotate(4deg); }
    }

    @keyframes mascot-chaos {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      20%  { transform: translate(-4px, -2px) rotate(-5deg) scale(1.05); }
      40%  { transform: translate(4px, 1px) rotate(5deg) scale(0.96); }
      60%  { transform: translate(-3px, 2px) rotate(-3deg) scale(1.03); }
      80%  { transform: translate(3px, -1px) rotate(4deg) scale(0.97); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mascot { animation: none !important; }
    }

    /* ── Count ── */
    .count-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-count {
      font-size: 64px;
      font-weight: 500;
      line-height: 1;
      color: #c2185b;
      text-shadow:
        0 2px 8px rgba(194, 24, 91, 0.25),
        0 0 24px rgba(194, 24, 91, 0.12);
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    .tabs-label {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #1a0a12;
      opacity: 0.45;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c2185b, transparent);
      opacity: 0.3;
    }

    .verdict {
      font-size: 13px;
      font-weight: 400;
      font-style: italic;
      color: #1a0a12;
      line-height: 1.5;
      transition: color 0.4s ease;
      min-height: 20px;
    }

    /* ── State: fine ── */
    body.state-fine { background-color: #e8f5e9; }
    body.state-fine .title  { color: #2e7d32; }
    body.state-fine .tab-count {
      color: #2e7d32;
      text-shadow: 0 2px 8px rgba(46,125,50,0.2), 0 0 24px rgba(46,125,50,0.1);
    }
    body.state-fine .divider { background: linear-gradient(90deg, transparent, #2e7d32, transparent); }
    body.state-fine .verdict { color: #1b5e20; }

    /* ── State: spicy ── */
    body.state-spicy { background-color: #fff8e1; }
    body.state-spicy .title { color: #e65100; }
    body.state-spicy .tab-count {
      color: #e65100;
      text-shadow: 0 2px 8px rgba(230,81,0,0.2), 0 0 24px rgba(230,81,0,0.1);
    }
    body.state-spicy .divider { background: linear-gradient(90deg, transparent, #e65100, transparent); }
    body.state-spicy .verdict { color: #bf360c; }

    /* ── State: cooked ── */
    body.state-cooked { background-color: #fce4ec; }
    body.state-cooked .title { color: #ad1457; }
    body.state-cooked .tab-count {
      color: #ad1457;
      text-shadow: 0 2px 8px rgba(173,20,87,0.25), 0 0 24px rgba(173,20,87,0.12);
    }
    body.state-cooked .divider { background: linear-gradient(90deg, transparent, #ad1457, transparent); }
    body.state-cooked .verdict { color: #880e4f; }

    /* ── State: 911 ── */
    body.state-911 { background-color: #f8bbd0; }
    body.state-911 .title { color: #b71c1c; }
    body.state-911 .tab-count {
      color: #b71c1c;
      text-shadow: 0 2px 8px rgba(183,28,28,0.3), 0 0 28px rgba(183,28,28,0.15);
    }
    body.state-911 .divider { background: linear-gradient(90deg, transparent, #b71c1c, transparent); }
    body.state-911 .verdict { color: #7f0000; }
  </style>
</head>
<body>
  <div class="container">
    <span class="title">are you cooked?</span>
    <div class="mascot-wrap">
      <img class="mascot panic-0" id="mascot" src="Mascot.png" alt="bestie" />
    </div>
    <div class="count-wrapper">
      <div class="tab-count" id="tabCount">—</div>
      <div class="tabs-label">tabs open</div>
    </div>
    <div class="divider"></div>
    <div class="verdict" id="verdict">counting...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
