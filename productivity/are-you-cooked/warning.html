<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homie are you cooked?!</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <div class="warning-container">
    <div class="warning-card">
      <div class="mascot-wrap">
        <img class="mascot" src="mascot.png" alt="Sparky — LoveSpark mascot" />
      </div>
      <h1 class="warning-title" id="title">Homie are you cooked?! 🔥</h1>
      <p class="warning-sub">You have <span class="tab-num" id="count">?</span> tabs open bestie 💀</p>
      <div class="btn-group" id="btnGroup">
        <button class="btn-dismiss" id="dismissBtn">I know I know... 😭</button>
        <button class="btn-mindful" id="mindfulBtn">You are right, let me be mindful</button>
      </div>
      <div class="progress-track" id="progressTrack">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
