<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Color Picker</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="theme-dropdown">
    <button id="themeToggle" class="theme-dropdown-trigger"
            aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
      retro
    </button>
    <div id="themeMenu" class="theme-dropdown-menu" role="menu">
      <div class="theme-dropdown-header">Theme</div>
      <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
      <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
      <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
      <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
    </div>
  </div>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky -- LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Color Picker</div>
        <div class="header-sub" id="popupDesc">LoveSpark Suite</div>
      </div>
    </header>
    <main class="popup-content">
      <div class="status-section">
        <div id="statusIcon" class="status-icon" aria-hidden="true">&#127912;</div>
        <div id="statusText" class="status-text" aria-live="polite">Pick a color from any page</div>
        <div id="cuteMsg" class="cute-msg">Stay sparkly!</div>
        <label class="toggle-wrap">
          <input type="checkbox" id="enableToggle" checked aria-label="Enable extension">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>

      <button id="pickBtn" class="action-btn" aria-label="Pick color from page">
        Pick Color
      </button>

      <div id="colorResult" class="color-result" style="display:none;" aria-label="Picked color details">
        <div id="colorPreview" class="color-preview" aria-hidden="true"></div>
        <div class="color-values">
          <button class="color-value-row" id="copyHex" aria-label="Copy hex value">
            <span class="color-value-label">HEX</span>
            <span id="hexValue" class="color-value-text">--</span>
          </button>
          <button class="color-value-row" id="copyRgb" aria-label="Copy RGB value">
            <span class="color-value-label">RGB</span>
            <span id="rgbValue" class="color-value-text">--</span>
          </button>
          <button class="color-value-row" id="copyHsl" aria-label="Copy HSL value">
            <span class="color-value-label">HSL</span>
            <span id="hslValue" class="color-value-text">--</span>
          </button>
        </div>
      </div>

      <div id="copyFeedback" class="copy-feedback" aria-live="polite"></div>

      <div class="history-section">
        <div class="history-header">
          <span class="history-title">Recent Colors</span>
          <button id="clearHistoryBtn" class="history-clear" aria-label="Clear color history">Clear</button>
        </div>
        <div id="historyGrid" class="history-grid" aria-label="Color history"></div>
      </div>

      <div class="stats-section" aria-label="Extension statistics">
        <div class="stat-box" aria-label="Picks today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Picks total">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">total</div>
        </div>
      </div>
    </main>
    <footer class="popup-footer">LoveSpark Suite</footer>
  </div>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
</body>
</html>
