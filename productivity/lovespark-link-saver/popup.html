<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Link Saver</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky -- LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Link Saver</div>
        <div class="header-sub" id="popupDesc">LoveSpark Suite</div>
      </div>
      <div class="theme-dropdown">
        <button class="theme-dropdown-trigger" id="themeToggle" aria-haspopup="true" aria-expanded="false" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span> &#9662;
        </button>
        <div class="theme-dropdown-menu" id="themeMenu" role="menu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option" data-theme="retro" role="menuitem">Retro Pink</button>
          <button class="theme-option" data-theme="dark" role="menuitem">Dark</button>
          <button class="theme-option" data-theme="beige" role="menuitem">Beige</button>
          <button class="theme-option" data-theme="slate" role="menuitem">Slate</button>
        </div>
      </div>
    </header>

    <main class="popup-content">
      <button id="saveBtn" class="save-btn" aria-label="Save current page link">Save This Page</button>

      <div class="stats-section" aria-label="Save statistics">
        <div class="stat-box" aria-label="Links saved today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Total links saved">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">total</div>
        </div>
      </div>

      <div class="links-header">
        <span class="links-title">Saved Links</span>
        <span id="linkCount" class="link-count" aria-live="polite">0</span>
      </div>
      <div id="linkList" class="link-list" role="list" aria-label="Saved links"></div>
      <div id="emptyState" class="empty-state" aria-live="polite">No saved links yet. Click "Save This Page" to start!</div>
    </main>

    <footer class="ls-footer">
      <span class="ls-footer-suite">LoveSpark Suite</span>
      <span class="ls-footer-credit">LoveSpark by Joona Tyrninoksa</span>
    </footer>
  </div>

  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
