<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveSpark Notes</title>
<link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../lib/lovespark-footer.css">
<link rel="stylesheet" href="../lib/lovespark-fonts.css">
</head>
<body>

<div class="popup-container">
  <header class="popup-header">
    <div class="header-left">
      <img src="../mascot.png" alt="Sparky — LoveSpark mascot" class="mascot">
      <span class="title"><span class="love">Love</span>Spark Notes</span>
    </div>
    <div class="header-right">
      <div class="sync-area" id="syncArea" style="display:none">
        <button class="sync-signin-btn" id="syncSignIn" style="display:none">Sign in</button>
        <div class="sync-user" id="syncUser" style="display:none">
          <button class="sync-avatar-btn" id="syncAvatarBtn" aria-label="Sync account menu">
            <span class="sync-avatar-initial" id="syncAvatarInitial" aria-hidden="true"></span>
            <span class="sync-pulse" id="syncPulse"></span>
          </button>
          <div class="sync-dropdown" id="syncDropdown" style="display:none">
            <div class="sync-email" id="syncEmail"></div>
            <button class="sync-action" id="syncNowBtn">Sync now</button>
            <div class="sync-last" id="syncLast">Never synced</div>
            <button class="sync-action sync-signout" id="syncSignOutBtn">Sign out</button>
          </div>
        </div>
      </div>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
      <button class="btn-open" id="btnOpen" title="Open full app (CMD+Shift+L)">Open app →</button>
    </div>
  </header>

  <div class="category-pills" id="categoryPills"></div>

  <div class="editor-card">
    <textarea id="noteContent" placeholder="What's on your mind? 💕" autofocus></textarea>
  </div>

  <div class="footer-row">
    <button class="btn-title" id="btnTitle">+ Add title</button>
    <input type="text" id="noteTitle" class="title-input" placeholder="Note title..." style="display:none" autocomplete="off">
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<script src="../lib/lovespark-footer.js"></script>
<script src="popup.js" type="module"></script>
</body>
</html>
