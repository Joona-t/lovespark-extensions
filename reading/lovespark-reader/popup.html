<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LoveSpark Reader</title>
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>

  <header class="header">
    <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="32" height="32">
    <div class="header-text">
      <span class="title">LoveSpark</span>
      <span class="subtitle">Reader</span>
    </div>
    <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
  </header>

  <!-- Mode pills -->
  <div class="modes" role="radiogroup" aria-label="Color mode">

    <button class="mode-pill" data-mode="sakura" aria-pressed="false">
      <span class="mode-icon" aria-hidden="true">🌸</span>
      <div class="mode-text">
        <span class="mode-name">Sakura</span>
        <span class="mode-desc">soft blush tones</span>
      </div>
      <span class="mode-check" aria-hidden="true">✦</span>
    </button>

    <button class="mode-pill" data-mode="hotpink" aria-pressed="false">
      <span class="mode-icon" aria-hidden="true">💖</span>
      <div class="mode-text">
        <span class="mode-name">Hot Pink</span>
        <span class="mode-desc">bold bubblegum</span>
      </div>
      <span class="mode-check" aria-hidden="true">✦</span>
    </button>

    <button class="mode-pill" data-mode="starlight" aria-pressed="false">
      <span class="mode-icon" aria-hidden="true">✨</span>
      <div class="mode-text">
        <span class="mode-name">Starlight</span>
        <span class="mode-desc">dreamy iridescent</span>
      </div>
      <span class="mode-check" aria-hidden="true">✦</span>
    </button>

  </div>

  <div class="divider"></div>

  <!-- Toggle row -->
  <div class="toggle-row">
    <label class="toggle-wrap" aria-label="Enable or disable LoveSpark Reader">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="toggle-track">
        <span class="toggle-thumb"></span>
      </span>
    </label>
    <p class="status-text" id="status-text">pinkifying the internet</p>
  </div>

  <!-- Disable on site -->
  <button class="site-toggle" id="site-toggle">Disable on this site</button>

  <script src="lib/browser-polyfill.min.js"></script>
  <script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
