<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Minimal Scroll</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
</head>
<body>
  <div class="popup-container" role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
    <header class="popup-header">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="40" height="40">
      <div class="header-text">
        <div class="header-title" id="popupTitle">Minimal Scroll</div>
        <div class="header-sub" id="popupDesc">LoveSpark Suite</div>
      </div>
      <div class="theme-dropdown" id="themeDropdown">
        <button class="theme-dropdown-trigger" id="themeToggle"
                aria-expanded="false" aria-haspopup="true" aria-label="Change theme">
          <span id="themeLabel">Retro Pink</span>
        </button>
        <div class="theme-dropdown-menu" id="themeMenu" role="menu">
          <div class="theme-dropdown-header">Change Theme</div>
          <button class="theme-option active" role="menuitem" data-theme="retro">Retro Pink</button>
          <button class="theme-option" role="menuitem" data-theme="dark">Dark Noir</button>
          <button class="theme-option" role="menuitem" data-theme="beige">Warm Beige</button>
          <button class="theme-option" role="menuitem" data-theme="slate">Cool Slate</button>
        </div>
      </div>
    </header>
    <main class="popup-content">
      <div class="status-section">
        <div id="statusIcon" class="status-icon" aria-hidden="true">&#9621;</div>
        <div id="statusText" class="status-text" aria-live="polite">Scroll Minimized</div>
        <div id="cuteMsg" class="cute-msg">Less clutter, more focus!</div>
        <label class="toggle-wrap">
          <input type="checkbox" id="enableToggle" checked aria-label="Enable minimal scroll globally">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>

      <!-- Per-site toggle -->
      <div class="site-toggle-section" aria-label="Per-site toggle">
        <div class="site-toggle-row">
          <span class="site-label" id="currentSiteLabel">Current site</span>
          <label class="toggle-wrap toggle-small">
            <input type="checkbox" id="siteToggle" checked aria-label="Enable for current site">
            <span class="toggle-track toggle-track-sm"><span class="toggle-thumb toggle-thumb-sm"></span></span>
          </label>
        </div>
        <div id="siteHostname" class="site-hostname" aria-live="polite">---</div>
      </div>

      <div class="stats-section" aria-label="Scroll statistics">
        <div class="stat-box" aria-label="Pages styled today">
          <div id="todayCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">pages today</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box" aria-label="Total pages styled">
          <div id="totalCount" class="stat-num" aria-live="polite">0</div>
          <div class="stat-label">total</div>
        </div>
      </div>
    </main>
    <footer class="popup-footer">LoveSpark Suite</footer>
  </div>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-popup.js"></script>
  <script src="lib/lovespark-footer.js"></script>
  <script src="popup.js"></script>

</body>
</html>
