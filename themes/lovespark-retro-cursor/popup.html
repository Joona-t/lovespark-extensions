<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aesthetic Pink Retro Cursor Pack by LoveSpark</title>
    <link rel="stylesheet" href="lib/lovespark-base.css">
    <link rel="stylesheet" href="lib/lovespark-tokens.css">
    <link rel="stylesheet" href="lib/lovespark-fonts.css">
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="lib/lovespark-footer.css">
  </head>
  <body>
    <main class="shell" role="dialog" aria-labelledby="popupTitle">
      <section class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;position:relative">
          <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot" width="32" height="32">
          <h1 id="popupTitle">Pink Retro Cursor Pack</h1>
          <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle" aria-expanded="false" aria-haspopup="true">
        <span id="themeLabel" aria-live="polite">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
        </div>
        <p class="subtitle">Cute cursors with soft glow and sparkle vibes ✨</p>

        <label class="toggle-row" for="cursorToggle">
          <span id="statusText" aria-live="polite">Cursors: ON</span>
          <span class="toggle-wrap">
            <input id="cursorToggle" type="checkbox" checked />
            <span class="slider"></span>
          </span>
        </label>

        <div class="theme-section">
          <p class="theme-group-label">OG</p>
          <div class="theme-list" id="themeList">
            <button class="theme-item" data-pack="retro-pink" type="button">
              <span class="swatch" style="background:linear-gradient(135deg,#ffb6c1,#ff69b4)"></span>
              <span class="theme-name">🌸 Retro Pink</span>
            </button>
            <button class="theme-item" data-pack="sakura-peach" type="button">
              <span class="swatch" style="background:linear-gradient(135deg,#ffd7b0,#ffb6c1)"></span>
              <span class="theme-name">🌺 Sakura Peach</span>
            </button>
            <button class="theme-item" data-pack="starlight-purple" type="button">
              <span class="swatch" style="background:linear-gradient(135deg,#c39bd3,#9b59b6)"></span>
              <span class="theme-name">⭐ Starlight Purple</span>
            </button>
          </div>

          <p class="theme-group-label">Y2K Korean</p>
          <details class="theme-subgroup" open>
            <summary><span class="sub-chevron" aria-hidden="true">▸</span> Emoji</summary>
            <div class="theme-list">
              <button class="theme-item" data-pack="honey-bunny-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFE5E5,#FFB8CC,#FF6E96)"></span>
                <span class="theme-name">🐰 Honey Bunny <span class="theme-korean">꿀토끼</span></span>
              </button>
              <button class="theme-item" data-pack="cyworld-dotti-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#E8E2EC,#FFA8C9,#FF5BAA)"></span>
                <span class="theme-name">💖 Cyworld Dotti <span class="theme-korean">싸이월드</span></span>
              </button>
              <button class="theme-item" data-pack="coquette-ribbon-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFC4D8,#FFEEF4,#FF6E96)"></span>
                <span class="theme-name">🎀 Coquette Ribbon <span class="theme-korean">리본</span></span>
              </button>
              <button class="theme-item" data-pack="strawberry-milk-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FF8FB0,#FFF8F0,#FFD96B)"></span>
                <span class="theme-name">🍓 Strawberry Milk <span class="theme-korean">딸기우유</span></span>
              </button>
              <button class="theme-item" data-pack="glossy-pearl-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFE2EE,#D5B8E8,#FFC8DD)"></span>
                <span class="theme-name">✨ Glossy Pearl</span>
              </button>
              <button class="theme-item" data-pack="bubble-boba-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#C4A8E0,#FFD8E5,#3A2A3A)"></span>
                <span class="theme-name">🧋 Bubble Boba <span class="theme-korean">버블티</span></span>
              </button>
              <button class="theme-item" data-pack="phone-charm-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFB8D9,#FF3D8A,#C8CCD2)"></span>
                <span class="theme-name">📱 Phone Charm <span class="theme-korean">폰꽂이</span></span>
              </button>
              <button class="theme-item" data-pack="heart-locket-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#D8C8D8,#FFB6CC,#E84A85)"></span>
                <span class="theme-name">💝 Heart Locket <span class="theme-korean">하트 로켓</span></span>
              </button>
              <button class="theme-item" data-pack="cyber-butterfly-emoji" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFB8D5,#FF5BAA,#D5B8E8)"></span>
                <span class="theme-name">🦋 Cyber Butterfly <span class="theme-korean">나비</span></span>
              </button>
            </div>
          </details>
          <details class="theme-subgroup">
            <summary><span class="sub-chevron" aria-hidden="true">▸</span> Pointer</summary>
            <div class="theme-list">
              <button class="theme-item" data-pack="honey-bunny-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFE5E5,#FFB8CC,#FF6E96)"></span>
                <span class="theme-name">🐰 Honey Bunny <span class="theme-korean">꿀토끼</span></span>
              </button>
              <button class="theme-item" data-pack="cyworld-dotti-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#E8E2EC,#FFA8C9,#FF5BAA)"></span>
                <span class="theme-name">💖 Cyworld Dotti <span class="theme-korean">싸이월드</span></span>
              </button>
              <button class="theme-item" data-pack="coquette-ribbon-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFC4D8,#FFEEF4,#FF6E96)"></span>
                <span class="theme-name">🎀 Coquette Ribbon <span class="theme-korean">리본</span></span>
              </button>
              <button class="theme-item" data-pack="strawberry-milk-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FF8FB0,#FFF8F0,#FFD96B)"></span>
                <span class="theme-name">🍓 Strawberry Milk <span class="theme-korean">딸기우유</span></span>
              </button>
              <button class="theme-item" data-pack="glossy-pearl-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFE2EE,#D5B8E8,#FFC8DD)"></span>
                <span class="theme-name">✨ Glossy Pearl</span>
              </button>
              <button class="theme-item" data-pack="bubble-boba-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#C4A8E0,#FFD8E5,#3A2A3A)"></span>
                <span class="theme-name">🧋 Bubble Boba <span class="theme-korean">버블티</span></span>
              </button>
              <button class="theme-item" data-pack="phone-charm-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFB8D9,#FF3D8A,#C8CCD2)"></span>
                <span class="theme-name">📱 Phone Charm <span class="theme-korean">폰꽂이</span></span>
              </button>
              <button class="theme-item" data-pack="heart-locket-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#D8C8D8,#FFB6CC,#E84A85)"></span>
                <span class="theme-name">💝 Heart Locket <span class="theme-korean">하트 로켓</span></span>
              </button>
              <button class="theme-item" data-pack="cyber-butterfly-pointer" type="button">
                <span class="swatch" style="background:linear-gradient(135deg,#FFB8D5,#FF5BAA,#D5B8E8)"></span>
                <span class="theme-name">🦋 Cyber Butterfly <span class="theme-korean">나비</span></span>
              </button>
            </div>
          </details>
        </div>
      </section>
    </main>
    <script src="lib/browser-polyfill.min.js"></script>
    <script src="lib/lovespark-theme.js"></script>
    <script src="lib/lovespark-stats.js"></script>
    <script src="lib/lovespark-badge.js"></script>
    <script src="lib/lovespark-popup.js"></script>
    <script src="lib/lovespark-lifecycle.js"></script>
    <script src="lib/lovespark-footer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
