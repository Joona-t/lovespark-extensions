<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveSpark Syntax Art</title>
  <link rel="stylesheet" href="lib/lovespark-base.css">
  <link rel="stylesheet" href="lib/lovespark-fonts.css">
  <link rel="stylesheet" href="lib/lovespark-footer.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body role="dialog" aria-labelledby="popupTitle" aria-describedby="popupDesc">
  <span id="popupDesc" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">LoveSpark Syntax Art settings — pick a code theme, width, and font size for image-to-code-art conversion.</span>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <span class="header-icon">🌸</span>
      <span class="header-title" id="popupTitle">Syntax Art</span>
      <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-dropdown-trigger" id="themeToggle" aria-expanded="false" aria-haspopup="true">
        <span id="themeLabel">Retro Pink</span> ▾
      </button>
      <div class="theme-dropdown-menu" id="themeMenu">
        <div class="theme-dropdown-header">Change Theme</div>
        <button class="theme-option" data-theme="retro">Retro Pink</button>
        <button class="theme-option" data-theme="dark">Dark</button>
        <button class="theme-option" data-theme="beige">Beige</button>
        <button class="theme-option" data-theme="slate">Slate</button>
      </div>
    </div>
    </header>

    <!-- How to use -->
    <div class="hint-card">
      <div class="hint-text">Right-click any image and choose<br><strong>"Convert to Syntax Art"</strong></div>
    </div>

    <!-- Theme selector -->
    <div class="settings-section">
      <div class="setting-label">Theme</div>
      <div class="pill-selector" id="themeSelector">
        <button class="pill" data-value="dracula">Dracula</button>
        <button class="pill" data-value="monokai">Monokai</button>
        <button class="pill" data-value="lovespark">LoveSpark</button>
        <button class="pill" data-value="github-light">GitHub Light</button>
      </div>
    </div>

    <!-- Width slider -->
    <div class="settings-section">
      <div class="setting-row">
        <span class="setting-label">Width</span>
        <span class="setting-value" id="widthValue">120 chars</span>
      </div>
      <input type="range" id="widthSlider" min="60" max="200" value="120" step="10" class="range-slider">
    </div>

    <!-- Font size -->
    <div class="settings-section">
      <div class="setting-label">Font size</div>
      <div class="pill-selector" id="fontSizeSelector">
        <button class="pill" data-value="6">6px</button>
        <button class="pill" data-value="8">8px</button>
        <button class="pill" data-value="10">10px</button>
        <button class="pill" data-value="12">12px</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-card">
      <div class="stats-row">
        <span class="stats-label">Converted today</span>
        <span class="stats-value" id="todayCount">0</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Total converted</span>
        <span class="stats-value" id="totalCount">0</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <img src="mascot.png" alt="Sparky — LoveSpark mascot" class="mascot">
      <span id="motivational" class="motivational"></span>
      <span class="suite-branding">LoveSpark Suite 💕</span>
    </footer>
  </div>

  <script src="lib/browser-polyfill.min.js"></script>
  <script src="lib/lovespark-theme.js"></script>
  <script src="lib/lovespark-footer.js"></script>
<script src="popup.js"></script>
</body>
</html>
